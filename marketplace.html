<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فور يو | سوق المتاجر العامة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-between selection:bg-[#FFB800] selection:text-[#121212]">

    <!-- الهيدر العلوي -->
    <header class="p-4 sm:p-6 flex justify-between items-center border-b border-gray-800/60 bg-[#121212]/80 backdrop-blur-md sticky top-0 z-45">
        <div class="flex items-center space-x-3 space-x-reverse">
            <a href="index.html" class="w-10 h-10 bg-[#1E1E1E] border border-gray-800 rounded-xl flex items-center justify-center text-[#FFB800] hover:bg-gray-800 transition">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <div>
                <h1 class="text-lg font-black tracking-wider">سوق فور يو <span class="text-[#FFB800] text-xs">Marketplace</span></h1>
                <p class="text-[11px] text-gray-400">تصفح منتجات المتاجر واطلب فوراً</p>
            </div>
        </div>

        <div class="flex items-center space-x-2 space-x-reverse">
            <a href="track.html" class="bg-[#1E1E1E] border border-gray-700 text-[#FFB800] text-xs font-bold px-3 py-2 rounded-xl hover:bg-gray-800 transition flex items-center shadow">
                <i class="fa-solid fa-location-crosshairs ml-1.5"></i> تتبع الطلب
            </a>
        </div>
    </header>

    <!-- المحتوى الرئيسي (عرض منتجات المتاجر) -->
    <main class="flex-grow p-4 sm:p-6 max-w-6xl mx-auto w-full">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
            <div>
                <h2 class="text-xl font-bold">المنتجات المتاحة حالياً</h2>
                <p class="text-xs text-gray-400">جميع السلع المرفوعة مباشرة من حسابات المتاجر المسجلة</p>
            </div>
            <div class="w-full sm:w-auto">
                <input type="text" id="searchMarketInput" onkeyup="filterMarketProducts()" placeholder="ابحث عن منتج أو متجر..." class="w-full sm:w-64 bg-[#1E1E1E] border border-gray-800 rounded-xl px-4 py-2 text-xs text-white focus:border-[#FFB800] outline-none transition">
            </div>
        </div>

        <!-- شبكة المنتجات -->
        <div id="marketProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-20 text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-[#FFB800] mb-3"></i>
                <p class="text-xs">جاري تحميل منتجات المتاجر الحقيقية...</p>
            </div>
        </div>

    </main>

    <!-- الفوتر السفلي -->
    <footer class="p-4 border-t border-gray-800/60 bg-[#1E1E1E] text-center text-xs text-gray-400">
        <p>فور يو (For-U) - نصلك قبل ما تطلب &copy; 2026</p>
    </footer>

    <!-- نافذة تأكيد الطلب -->
    <div id="orderModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#1E1E1E] border border-gray-800 rounded-3xl p-6 max-w-md w-full relative shadow-2xl">
            <h3 class="text-lg font-bold mb-1 text-[#FFB800]">إتمام طلب المنتج</h3>
            <p id="modalProductName" class="text-xs text-gray-300 mb-4 font-semibold"></p>
            
            <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-300 mb-1">اسم المستلم</label>
                    <input type="text" id="orderCustomerName" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:border-[#FFB800] outline-none" placeholder="اسمك الكامل">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-1">رقم الهاتـف</label>
                    <input type="tel" id="orderCustomerPhone" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:border-[#FFB800] outline-none" placeholder="0912345678">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-1">عنوان التوصيل بالتفصيل</label>
                    <textarea id="orderCustomerAddress" required rows="2" class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:border-[#FFB800] outline-none" placeholder="المدينة، الحي، شارع..."></textarea>
                </div>
                
                <div class="flex space-x-2 space-x-reverse pt-2">
                    <button type="submit" class="flex-grow bg-[#FFB800] text-[#121212] font-bold py-2.5 rounded-xl hover:bg-yellow-400 transition text-xs shadow">
                        تأكيد وإرسال الطلب
                    </button>
                    <button type="button" onclick="closeOrderModal()" class="bg-gray-800 text-gray-300 font-bold px-4 py-2.5 rounded-xl hover:bg-gray-700 transition text-xs">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة التنبيهات -->
    <div id="customAlertModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#1E1E1E] border border-gray-800 rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl">
            <div id="alertIconContainer" class="w-14 h-14 bg-[#FFB800]/10 border border-[#FFB800]/30 rounded-2xl flex items-center justify-center mx-auto mb-3 text-[#FFB800] text-xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h4 id="alertTitle" class="text-base font-bold mb-1">تنبيه النظام</h4>
            <p id="alertMessage" class="text-gray-300 text-xs mb-5 leading-relaxed">رسالة...</p>
            <button onclick="closeCustomAlert()" class="w-full bg-[#FFB800] text-[#121212] font-bold py-2.5 rounded-xl hover:bg-yellow-400 transition text-xs">
                حسنًا
            </button>
        </div>
    </div>

    <!-- كود الجافاسكريبت والربط الحقيقي بـ Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addFromServer, addDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-5YFGfzldH3OyWOH7z96vCbUd0isw6aM",
            authDomain: "for-u-56f3f.firebaseapp.com",
            projectId: "for-u-56f3f",
            storageBucket: "for-u-56f3f.firebasestorage.app",
            messagingSenderId: "519930793199",
            appId: "1:519930793199:web:0c876d149832cd0a8d5f1a",
            measurementId: "G-2ZV3NGRYZG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProductsList = [];
        let selectedProductForOrder = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchMarketProducts();
            const savedName = localStorage.getItem('foru_user_name');
            if(savedName) {
                document.getElementById('orderCustomerName').value = savedName;
            }
        });

        // جلب المنتجات الحقيقية من قاعدة بيانات Firestore (مجموعة products أو المتاجر)
        async function fetchMarketProducts() {
            const grid = document.getElementById('marketProductsGrid');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                allProductsList = [];
                querySnapshot.forEach((doc) => {
                    allProductsList.push({ id: doc.id, ...doc.data() });
                });

                // إذا لم توجد منتجات في السيرفر، نجلب الاحتياطي من الـ LocalStorage للتوافق
                if (allProductsList.length === 0) {
                    const localStored = localStorage.getItem('foru_store_products');
                    if (localStored) {
                        allProductsList = JSON.parse(localStored);
                    }
                }

                renderProducts(allProductsList);
            } catch (error) {
                console.error("Error fetching products: ", error);
                // الرجوع للتخزين المحلي في حال عدم الاتصال المؤقت
                const localStored = localStorage.getItem('foru_store_products');
                allProductsList = localStored ? JSON.parse(localStored) : [];
                renderProducts(allProductsList);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('marketProductsGrid');
            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-gray-400">
                        <i class="fa-solid fa-box-open text-4xl text-gray-600 mb-2"></i>
                        <p class="text-xs">لا توجد منتجات مضافة حالياً من المتاجر.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = products.map(product => `
                <div class="bg-[#1E1E1E] border border-gray-800 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between transition hover:border-[#FFB800]/50">
                    <div>
                        <div class="h-40 bg-gray-800 relative overflow-hidden">
                            <img src="${product.image || 'image.jpg'}" alt="${product.name}" class="w-full h-full object-cover" onerror="this.src='image.jpg'">
                            <span class="absolute top-2 right-2 bg-black/70 backdrop-blur-md text-[#FFB800] text-[10px] font-bold px-2.5 py-1 rounded-lg border border-[#FFB800]/20">
                                <i class="fa-solid fa-store ml-1"></i> ${product.store || 'متجر معتمد'}
                            </span>
                        </div>
                        <div class="p-3">
                            <h3 class="font-bold text-sm mb-1 text-white truncate">${product.name}</h3>
                            <p class="text-gray-400 text-[11px] mb-3 line-clamp-2">${product.desc || 'لا توجد تفاصيل إضافية عن المنتج.'}</p>
                        </div>
                    </div>
                    <div class="p-3 pt-0 flex items-center justify-between border-t border-gray-800/60 mt-2">
                        <span class="text-[#FFB800] font-black text-xs">${product.price} ج.س</span>
                        <button onclick='window.openOrderModalFromIndex(${JSON.stringify(product)})' class="bg-[#FFB800] text-[#121212] font-bold px-3 py-1.5 rounded-xl hover:bg-yellow-400 transition text-xs shadow flex items-center">
                            <i class="fa-solid fa-cart-shopping ml-1"></i> اطلب الآن
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.filterMarketProducts = function() {
            const query = document.getElementById('searchMarketInput').value.toLowerCase();
            const filtered = allProductsList.filter(p => 
                p.name.toLowerCase().includes(query) || 
                (p.store && p.store.toLowerCase().includes(query))
            );
            renderProducts(filtered);
        };

        window.openOrderModalFromIndex = function(product) {
            selectedProductForOrder = product;
            document.getElementById('modalProductName').innerText = `المنتج: ${product.name} - السعر: ${product.price} ج.س`;
            const modal = document.getElementById('orderModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeOrderModal = function() {
            const modal = document.getElementById('orderModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        };

        window.submitOrder = async function(event) {
            event.preventDefault();
            const name = document.getElementById('orderCustomerName').value;
            const phone = document.getElementById('orderCustomerPhone').value;
            const address = document.getElementById('orderCustomerAddress').value;

            const newOrder = {
                id: 'ORD-' + Math.floor(100000 + Math.random() * 900000),
                productName: selectedProductForOrder.name,
                productPrice: selectedProductForOrder.price,
                storeName: selectedProductForOrder.store || 'متجر عام',
                customerName: name,
                customerPhone: phone,
                customerAddress: address,
                status: 'قيد المراجعة',
                date: new Date().toLocaleString()
            };

            try {
                // محاولة حفظ الطلب في قاعدة البيانات الحقيقية Firestore
                await addDoc(collection(db, "orders"), newOrder);
            } catch (e) {
                console.log("Firestore offline, saving locally.");
            }

            // حفظ احتياطي في التخزين المحلي لصفحة التتبع
            let existingOrders = JSON.parse(localStorage.getItem('foru_store_orders') || '[]');
            existingOrders.push(newOrder);
            localStorage.setItem('foru_store_orders', JSON.stringify(existingOrders));

            closeOrderModal();
            showCustomAlert('نجاح الطلب', `✅ تم إرسال طلبك بنجاح!\nرقم الطلب: ${newOrder.id}\nسيتم تحويلك لصفحة التتبع الآن.`);
        };

        function showCustomAlert(title, message) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        window.closeCustomAlert = function() {
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            window.location.href = 'track.html';
        };
    </script>
</body>
</html>
