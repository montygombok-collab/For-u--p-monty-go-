<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For-U | فور يو - توصيل طلباتك بسرعة وأمان</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FFB800',
                        brandDark: '#121212',
                        brandCard: '#1E1E1E'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-brandDark text-white min-h-screen flex flex-col justify-between">

    <!-- الهيدر / الشعار (بدون أزرار دخول ظاهرة) -->
    <header class="p-6 flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="bg-brandYellow text-brandDark font-black text-2xl px-3 py-1 rounded-xl shadow-lg">4U</div>
            <div>
                <h1 class="text-xl font-bold tracking-wider">فور يو <span class="text-brandYellow text-sm">For-U</span></h1>
                <p class="text-xs text-gray-400">توصيل طلباتك بسرعة وأمان</p>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي (البطل / Hero Section) -->
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="max-w-4xl mx-auto text-center">
            <span class="bg-brandYellow/10 text-brandYellow text-sm font-semibold px-4 py-1.5 rounded-full border border-brandYellow/20 inline-block mb-6">
                🚀 النظام اللوجستعي الذكي والمتكامل
            </span>
            <h2 class="text-4xl md:text-6xl font-black mb-6 leading-tight">
                أسرع طريقة لإدارة وتوصيل <span class="text-brandYellow">طلباتك بكل أمان</span>
            </h2>
            <p class="text-gray-400 text-lg mb-10 max-w-2xl mx-auto">
                منصة متكاملة تربط العملاء، المسوقين، والمناديب، مع نظام تتبع جغرافي ذكي وإدارة دقيقة للمخازن والماليات.
            </p>

            <div class="flex justify-center">
                <!-- زر طلب توصيل سريع للعميل (المتاح للعامة فقط) -->
                <a href="customer.html" class="bg-brandYellow text-brandDark font-bold text-lg px-10 py-4 rounded-2xl hover:bg-yellow-400 transition shadow-lg flex items-center justify-center">
                    <i class="fa-solid fa-box-open ml-2"></i> اطلب توصيل طلبك الآن
                </a>
            </div>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="p-6 text-center border-t border-gray-800 text-gray-500 text-sm">
        جميع الحقوق محفوظة &copy; 2026 For-U Ecosystem
    </footer>

</body>
</html>
