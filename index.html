<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For-U | لوحة التحكم - مدير النظام</title>
    
    <!-- الوسوم الخاصة بإظهار شعار المنصة واسمها بالكامل على الهواتف والأجهزة -->
    <link rel="icon" type="image/png" href="image.jpg">
    <link rel="apple-touch-icon" href="image.jpg">
    <link rel="apple-touch-icon" sizes="152x152" href="image.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="image.jpg">
    <link rel="apple-touch-icon" sizes="167x167" href="image.jpg">
    <meta name="apple-mobile-web-app-title" content="For-U">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
        }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col selection:bg-[#FFB800] selection:text-[#121212]">

    <!-- شاشة التحميل -->
    <div id="loadingOverlay" class="fixed inset-0 bg-[#121212] z-50 flex flex-col items-center justify-center space-y-4 transition-opacity duration-300">
        <div class="w-16 h-16 border-4 border-[#FFB800]/20 border-t-[#FFB800] rounded-full animate-spin"></div>
        <p class="text-[#FFB800] font-bold text-sm tracking-wide animate-pulse">جاري التحقق من الصلاحيات وتحميل لوحة التحكم...</p>
    </div>

    <!-- الهيدر العلوي للوحة التحكم -->
    <header class="p-4 sm:p-6 bg-[#1E1E1E] border-b border-gray-800 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-12 h-12 bg-[#FFB800] text-[#121212] rounded-2xl flex items-center justify-center font-black text-xl shadow-md">
                4U
            </div>
            <div>
                <h1 class="text-lg font-bold">لوحة التحكم</h1>
                <p class="text-xs text-[#FFB800]">الصلاحية: مدير النظام</p>
            </div>
        </div>

        <div>
            <button onclick="logoutUser()" class="bg-red-500/20 border border-red-500/50 text-red-400 text-xs font-bold px-3 py-2 rounded-xl hover:bg-red-500/30 transition flex items-center shadow-md">
                <i class="fa-solid fa-right-from-bracket ml-1.5"></i> خروج
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي للوحة التحكم -->
    <main class="flex-grow p-4 sm:p-6 max-w-7xl mx-auto w-full space-y-6">
        
        <!-- إحصائيات سريعة -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="bg-[#1E1E1E] border border-gray-800 p-4 rounded-2xl shadow-md text-center">
                <p class="text-xs text-gray-400 mb-1">إجمالي الطلبات</p>
                <h3 id="totalOrdersCount" class="text-2xl font-black text-[#FFB800]">0</h3>
            </div>
            <div class="bg-[#1E1E1E] border border-gray-800 p-4 rounded-2xl shadow-md text-center">
                <p class="text-xs text-gray-400 mb-1">المكتملة</p>
                <h3 id="completedOrdersCount" class="text-2xl font-black text-green-400">0</h3>
            </div>
            <div class="bg-[#1E1E1E] border border-gray-800 p-4 rounded-2xl shadow-md text-center">
                <p class="text-xs text-gray-400 mb-1">إيرادات التوصيل</p>
                <h3 class="text-2xl font-black text-blue-400">0 ج</h3>
            </div>
            <div class="bg-[#1E1E1E] border border-gray-800 p-4 rounded-2xl shadow-md text-center">
                <p class="text-xs text-gray-400 mb-1">إيرادات المبيعات</p>
                <h3 class="text-2xl font-black text-purple-400">0 ج</h3>
            </div>
        </div>

        <!-- قسم إرسال طلب جديد للمناديب -->
        <div class="bg-[#1E1E1E] border border-gray-800 p-5 rounded-3xl shadow-xl">
            <h3 class="text-base font-bold mb-4 text-[#FFB800] flex items-center">
                <i class="fa-solid fa-paper-plane ml-2"></i> إرسال طلب جديد للمناديب
            </h3>
            <form id="newOrderForm" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">اسم العميل</label>
                    <input type="text" id="orderCustomerName" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="محمد أحمد">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">هاتف العميل</label>
                    <input type="text" id="orderCustomerPhone" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="0912345678">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs text-gray-400 mb-1">اسم المتجر / العنوان</label>
                    <input type="text" id="orderStoreName" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="متجر السعادة - السوق العربي">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">القيمة (جنيه)</label>
                    <input type="number" id="orderPrice" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="5000">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">تفاصيل الطلب</label>
                    <input type="text" id="orderDetailsService" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="وجبة عشاء مع المشروب">
                </div>
                <div class="sm:col-span-2 mt-2">
                    <button type="submit" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg text-sm flex items-center justify-center">
                        <i class="fa-solid fa-truck-fast ml-2"></i> نشر الطلب للمناديب الآن
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-5YFGfzldH3OyWOH7z96vCbUd0isw6aM",
            authDomain: "for-u-56f3f.firebaseapp.com",
            projectId: "for-u-56f3f",
            storageBucket: "for-u-56f3f.firebasestorage.app",
            messagingSenderId: "519930793199",
            appId: "1:519930793199:web:0c876d149832cd0a8d5f1a",
            measurementId: "G-2ZV3NGRYZG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // إخفاء شاشة التحميل بمجرد جهوزية الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loadingOverlay');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 300);
            }
        });

        // دالة تسجيل الخروج المحسنة والنظيفة
        window.logoutUser = function() {
            localStorage.removeItem('foru_user_name');
            localStorage.removeItem('foru_user_email');
            localStorage.removeItem('foru_user_role');
            localStorage.clear();

            signOut(auth).then(() => {
                window.location.replace('index.html');
            }).catch((error) => {
                console.error("خطأ أثناء تسجيل الخروج:", error);
                window.location.replace('index.html');
            });
        };

        // معالجة إرسال طلب جديد للمناديب وحفظه في Firestore
        document.getElementById('newOrderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const customerName = document.getElementById('orderCustomerName').value;
            const customerPhone = document.getElementById('orderCustomerPhone').value;
            const storeName = document.getElementById('orderStoreName').value;
            const price = document.getElementById('orderPrice').value;
            const details = document.getElementById('orderDetailsService').value;

            try {
                await addDoc(collection(db, "orders"), {
                    customerName,
                    customerPhone,
                    storeName,
                    price,
                    details,
                    status: 'جديد',
                    createdAt: new Date().toISOString()
                });
                alert('✅ تم نشر الطلب للمناديب بنجاح!');
                document.getElementById('newOrderForm').reset();
            } catch (error) {
                console.error("خطأ في إضافة الطلب:", error);
                alert('❌ حدث خطأ أثناء إرسال الطلب.');
            }
        });
    </script>
</body>
</html>
