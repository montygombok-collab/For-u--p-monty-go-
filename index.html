<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For-U | فور يو - نصلك قبل ما تطلب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }
    </style>
</head>
<body class="bg-[#121212] text-white h-screen flex flex-col justify-between selection:bg-[#FFB800] selection:text-[#121212]">

    <!-- الهيدر العلوي -->
    <header class="p-4 sm:p-6 flex justify-between items-center border-b border-gray-800/60">
        <div class="flex items-center space-x-2 space-x-reverse">
            <!-- قسم عرض اسم المستخدم وحالة تسجيل الدخول (يظهر بعد الدخول) -->
            <div id="userProfileDisplay" class="hidden items-center space-x-2 space-x-reverse bg-[#1E1E1E] border border-gray-800 px-3 py-1.5 rounded-xl shadow-lg">
                <i class="fa-solid fa-circle-user text-[#FFB800] text-lg"></i>
                <span id="userNameSpan" class="text-xs text-white font-semibold"></span>
                <button onclick="logoutUser()" class="bg-red-500/20 border border-red-500/50 text-red-400 text-xs font-bold px-2.5 py-1 rounded-lg hover:bg-red-500/30 transition mr-1">
                    خروج
                </button>
            </div>
        </div>

        <div class="flex space-x-2 space-x-reverse items-center">
            <!-- أزرار الدخول العادية في الهيدر (تظهر قبل الدخول) -->
            <div id="authButtonsContainer" class="flex space-x-2 space-x-reverse">
                <button onclick="openAuthModal('login')" class="bg-[#1E1E1E] border border-gray-700 text-[#FFB800] text-sm font-bold px-4 py-2 rounded-xl hover:bg-gray-800 transition shadow-md flex items-center">
                    <i class="fa-solid fa-right-to-bracket ml-2"></i> تسجيل الدخول
                </button>
                <button onclick="registerAsStore()" class="bg-[#FFB800] text-[#121212] text-sm font-bold px-4 py-2 rounded-xl hover:bg-yellow-400 transition shadow-lg hidden sm:flex items-center">
                    <i class="fa-solid fa-store ml-2"></i> التسجيل كمتجر
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي في منتصف الشاشة تماماً -->
    <main class="flex-grow flex items-center justify-center px-6">
        <div class="max-w-md w-full text-center flex flex-col items-center">
            
            <span class="bg-[#FFB800]/10 text-[#FFB800] text-xs font-semibold px-3 py-1 rounded-full border border-[#FFB800]/20 inline-block mb-3">
                🚀 نصلك قبل ما تطلب 
            </span>

            <!-- الشعار والعنوان في المنتصف -->
            <div class="mb-4 flex flex-col items-center">
                <img src="image.jpg" alt="For-U Logo" class="w-20 h-20 object-cover rounded-2xl shadow-2xl border-2 border-[#FFB800]/40 mb-3 animate-pulse">
                <h1 class="text-3xl font-black tracking-wider mb-1">فور يو <span class="text-[#FFB800] text-base">FOR-U</span></h1>
                <p class="text-xs text-gray-400">توصيل طلباتك بسرعة وأمان</p>
            </div>

            <p class="text-gray-400 text-sm mb-6 max-w-sm leading-relaxed">
                اطلب توصيل لطلباتك واعرض بضاعتك ومنتجاتك  
            </p>

            <!-- زر البدء أو اطلب الآن في المنتصف -->
            <div class="w-full flex flex-col space-y-3">
                <div id="centerActionContainer" class="flex flex-col space-y-3">
                    <button id="centerActionBtn" onclick="openAuthModal('login')" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3.5 px-6 rounded-2xl hover:bg-yellow-400 transition shadow-lg flex items-center justify-center text-sm">
                        <i class="fa-solid fa-box-open ml-2"></i> ابدأ الآن / تسجيل الدخول
                    </button>
                    <button onclick="registerAsStore()" class="w-full bg-[#1E1E1E] border border-[#FFB800] text-[#FFB800] font-bold py-3.5 px-6 rounded-2xl hover:bg-[#FFB800]/10 transition shadow-lg flex items-center justify-center text-sm sm:hidden">
                        <i class="fa-solid fa-store ml-2"></i> التسجيل كمتجر
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- نافذة المصادقة -->
    <div id="authModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#1E1E1E] border border-gray-800 rounded-3xl p-6 max-w-md w-full relative shadow-2xl">
            
            <div class="text-center mb-5">
                <img src="image.jpg" alt="For-U Logo" class="w-14 h-14 object-cover mx-auto rounded-xl mb-2 shadow-lg border border-[#FFB800]/30">
                <h3 id="modalTitle" class="text-xl font-bold">تسجيل الدخول / إنشاء حساب</h3>
                <p id="modalSubtitle" class="text-xs text-gray-400 mt-1">يرجى تسجيل الدخول والمضي قدماً</p>
            </div>

            <div class="space-y-3 mb-3">
                <button type="button" onclick="loginWithGoogle()" class="w-full bg-white text-gray-800 font-bold py-3 px-4 rounded-xl hover:bg-gray-100 transition shadow flex items-center justify-center space-x-3 space-x-reverse text-sm">
                    <i class="fa-brands fa-google text-red-500 text-lg"></i>
                    <span>التسجيل أو الدخول بواسطة Google</span>
                </button>
            </div>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-gray-700"></div>
                <span class="flex-shrink mx-4 text-gray-500 text-xs">سجل بالبريد الإلكتروني</span>
                <div class="flex-grow border-t border-gray-700"></div>
            </div>

            <form id="authForm" class="space-y-3 mt-2" onsubmit="handleEmailAuth(event)">
                <div id="nameFieldContainer" class="hidden">
                    <label class="block text-xs text-gray-300 mb-1">الاسم الكامل</label>
                    <input type="text" id="fullName" class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="محمد أحمد">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="name@foru.com">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="••••••••">
                </div>
                <button type="submit" id="submitBtnText" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg mt-1 text-sm">
                    دخول 
                </button>
            </form>

            <div class="text-center mt-4 text-xs text-gray-400">
                <span id="switchPrompt">ليس لديك حساب؟</span>
                <button type="button" onclick="toggleAuthMode()" id="switchBtnText" class="text-[#FFB800] font-bold mr-1 hover:underline">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <!-- نافذة التنبيه -->
    <div id="customAlertModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#1E1E1E] border border-gray-800 rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl">
            <div id="alertIconContainer" class="w-16 h-16 bg-[#FFB800]/10 border border-[#FFB800]/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-[#FFB800] text-2xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h4 id="alertTitle" class="text-xl font-bold mb-2">تنبيه النظام</h4>
            <p id="alertMessage" class="text-gray-300 text-sm mb-6 leading-relaxed">رسالة التنبيه هنا...</p>
            <button onclick="closeCustomAlert()" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg">
                حسنًا، شكرًا
            </button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            GoogleAuthProvider,
            signInWithPopup,
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-5YFGfzldH3OyWOH7z96vCbUd0isw6aM",
            authDomain: "for-u-56f3f.firebaseapp.com",
            projectId: "for-u-56f3f",
            storageBucket: "for-u-56f3f.firebasestorage.app",
            messagingSenderId: "519930793199",
            appId: "1:519930793199:web:0c876d149832cd0a8d5f1a",
            measurementId: "G-2ZV3NGRYZG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error("Auth persistence error:", error);
        });

        let currentMode = 'login';

        // دالة حفظ المستخدم في قاعدة البيانات بصلاحية "عميل" افتراضياً
        async function saveUserToFirestore(user, customName = '') {
            try {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                const displayName = customName || user.displayName || user.email.split('@')[0];

                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        uid: user.uid,
                        name: displayName,
                        email: user.email,
                        phone: user.phoneNumber || 'غير مسجل',
                        role: 'عميل', // تعيين الصلاحية الافتراضية كـ "عميل" فقط لكل مسجل جديد
                        createdAt: new Date().toISOString()
                    });
                } else {
                    await setDoc(userRef, {
                        email: user.email,
                        name: userSnap.data().name || displayName
                    }, { merge: true });
                }
            } catch (error) {
                console.error("خطأ في حفظ بيانات المستخدم في السحابة:", error);
            }
        }

        window.showCustomAlert = function(title, message, isError = false) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const iconContainer = document.getElementById('alertIconContainer');
            if (isError) {
                iconContainer.className = "w-16 h-16 bg-red-500/10 border border-red-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-red-400 text-2xl";
                iconContainer.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                iconContainer.className = "w-16 h-16 bg-[#FFB800]/10 border border-[#FFB800]/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-[#FFB800] text-2xl";
                iconContainer.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }
            const alertModal = document.getElementById('customAlertModal');
            alertModal.classList.remove('hidden');
            alertModal.classList.add('flex');
        };

        window.closeCustomAlert = function() {
            const alertModal = document.getElementById('customAlertModal');
            alertModal.classList.remove('flex');
            alertModal.classList.add('hidden');
        };

        window.openAuthModal = function(mode) {
            currentMode = mode;
            updateModalUI();
            const modal = document.getElementById('authModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeAuthModal = function() {
            const savedEmail = localStorage.getItem('foru_user_email');
            if(!savedEmail) {
                showCustomAlert('تنبيه مطلوب', '⚠️ يجب تسجيل الدخول أو إنشاء حساب أولاً للمضي قدماً في النظام.', true);
                return;
            }
            const modal = document.getElementById('authModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        };

        window.toggleAuthMode = function() {
            currentMode = currentMode === 'login' ? 'register' : 'login';
            updateModalUI();
        };

        function updateModalUI() {
            const title = document.getElementById('modalTitle');
            const nameField = document.getElementById('nameFieldContainer');
            const submitBtn = document.getElementById('submitBtnText');
            const switchPrompt = document.getElementById('switchPrompt');
            const switchBtn = document.getElementById('switchBtnText');

            if (currentMode === 'register') {
                title.innerText = 'إنشاء حساب جديد';
                nameField.classList.remove('hidden');
                submitBtn.innerText = 'تسجيل الحساب';
                switchPrompt.innerText = 'لديك حساب بالفعل؟';
                switchBtn.innerText = 'تسجيل الدخول';
            } else {
                title.innerText = 'تسجيل الدخول';
                nameField.classList.add('hidden');
                submitBtn.innerText = 'دخول بالنظام';
                switchPrompt.innerText = 'ليس لديك حساب؟';
                switchBtn.innerText = 'إنشاء حساب جديد';
            }
        }

        window.registerAsStore = function() {
            localStorage.setItem('selectedAccountType', 'store');
            window.location.href = 'store-dashboard.html';
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('foru_user_name');
            const savedEmail = localStorage.getItem('foru_user_email');
            if (savedEmail) {
                updateUIAfterLogin(savedName || savedEmail);
            } else {
                openAuthModal('login');
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const displayName = user.displayName || user.email.split('@')[0];
                localStorage.setItem('foru_user_name', displayName);
                localStorage.setItem('foru_user_email', user.email);
                updateUIAfterLogin(displayName);
            }
        });

        function updateUIAfterLogin(displayName) {
            document.getElementById('authButtonsContainer').classList.add('hidden');
            
            const profileDisplay = document.getElementById('userProfileDisplay');
            profileDisplay.classList.remove('hidden');
            profileDisplay.classList.add('flex');
            document.getElementById('userNameSpan').innerText = displayName;

            const modal = document.getElementById('authModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');

            const centerContainer = document.getElementById('centerActionContainer');
            centerContainer.innerHTML = `
                <a href="customer.html" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3.5 px-6 rounded-2xl hover:bg-yellow-400 transition shadow-lg flex items-center justify-center text-sm">
                    <i class="fa-solid fa-box-open ml-2"></i> اطلب الآن
                </a>
                <a href="marketplace.html" class="w-full bg-emerald-500 text-white font-bold py-3.5 px-6 rounded-2xl hover:bg-emerald-600 transition shadow-lg flex items-center justify-center text-sm">
                    <i class="fa-solid fa-store ml-2"></i> السوق (عرض منتجات المتاجر)
                </a>
                <a href="track.html" class="w-full bg-[#1E1E1E] border border-[#FFB800] text-[#FFB800] font-bold py-3.5 px-6 rounded-2xl hover:bg-[#FFB800]/10 transition shadow-lg flex items-center justify-center text-sm">
                    <i class="fa-solid fa-location-crosshairs ml-2"></i> تتبع طلب
                </a>
                <button onclick="registerAsStore()" class="w-full bg-[#1E1E1E] border border-gray-700 text-gray-300 font-bold py-3.5 px-6 rounded-2xl hover:bg-gray-800 transition shadow-lg flex items-center justify-center text-sm">
                    <i class="fa-solid fa-gear ml-2"></i> لوحة تحكم المتجر (إضافة منتجات)
                </button>
            `;
        }

        window.loginWithGoogle = function() {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider)
                .then(async (result) => {
                    const user = result.user;
                    const displayName = user.displayName || user.email.split('@')[0];
                    
                    await saveUserToFirestore(user, displayName);

                    localStorage.setItem('foru_user_name', displayName);
                    localStorage.setItem('foru_user_email', user.email);
                    updateUIAfterLogin(displayName);
                    showCustomAlert('نجاح الحساب', '✅ تم تسجيل الدخول وإنشاء الحساب تلقائياً كـ (عميل) بنجاح!');
                })
                .catch((error) => {
                    showCustomAlert('خطأ في تسجيل الدخول', '❌ خطأ: ' + error.message, true);
                });
        };

        window.handleEmailAuth = function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const customNameInput = document.getElementById('fullName').value;

            if (currentMode === 'register') {
                createUserWithEmailAndPassword(auth, email, password)
                    .then(async (userCredential) => {
                        const user = userCredential.user;
                        const displayName = customNameInput.trim() !== '' ? customNameInput : email.split('@')[0];
                        
                        await saveUserToFirestore(user, displayName);

                        localStorage.setItem('foru_user_name', displayName);
                        localStorage.setItem('foru_user_email', user.email);
                        updateUIAfterLogin(displayName);
                        showCustomAlert('نجاح التسجيل', '✅ تم إنشاء الحساب كـ (عميل) وتسجيل الدخول بنجاح!');
                    })
                    .catch((error) => {
                        showCustomAlert('خطأ في الإنشاء', '❌ خطأ: ' + error.message, true);
                    });
            } else {
                signInWithEmailAndPassword(auth, email, password)
                    .then(async (userCredential) => {
                        const user = userCredential.user;
                        const displayName = user.displayName || email.split('@')[0];
                        
                        await saveUserToFirestore(user, displayName);

                        localStorage.setItem('foru_user_name', displayName);
                        localStorage.setItem('foru_user_email', user.email);
                        updateUIAfterLogin(displayName);
                        showCustomAlert('نجاح الدخول', '✅ تم تسجيل الدخول بنجاح!');
                    })
                    .catch((error) => {
                        showCustomAlert('خطأ في الدخول', '❌ البريد غير مسجل أو كلمة المرور خاطئة، يرجى إنشاء حساب.', true);
                    });
            }
        };

        window.logoutUser = function() {
            signOut(auth).then(() => {
                localStorage.removeItem('foru_user_name');
                localStorage.removeItem('foru_user_email');
                
                const profileDisplay = document.getElementById('userProfileDisplay');
                profileDisplay.classList.remove('flex');
                profileDisplay.classList.add('hidden');
                document.getElementById('authButtonsContainer').classList.remove('hidden');

                const centerContainer = document.getElementById('centerActionContainer');
                centerContainer.innerHTML = `
                    <button id="centerActionBtn" onclick="openAuthModal('login')" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3.5 px-6 rounded-2xl hover:bg-yellow-400 transition shadow-lg flex items-center justify-center text-sm">
                        <i class="fa-solid fa-box-open ml-2"></i> ابدأ الآن / تسجيل الدخول
                    </button>
                    <button onclick="registerAsStore()" class="w-full bg-brandCard border border-brandYellow text-brandYellow font-bold py-3.5 px-6 rounded-2xl hover:bg-brandYellow/10 transition shadow-lg flex items-center justify-center text-sm sm:hidden">
                        <i class="fa-solid fa-store ml-2"></i> التسجيل كمتجر
                    </button>
                `;

                showCustomAlert('تسجيل الخروج', '👋 تم تسجيل الخروج بنجاح');
                openAuthModal('login');
            });
        };
    </script>
</body>
</html>
