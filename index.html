<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For-U | فور يو - توصيل طلباتك بسرعة وأمان</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FFB800',
                        brandDark: '#121212',
                        brandCard: '#1E1E1E'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
    <!-- Firebase SDKs (Compat v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
</head>
<body class="bg-brandDark text-white min-h-screen flex flex-col justify-between">

    <!-- الهيدر / الشعار في الوسط -->
    <header class="p-6 flex justify-center items-center border-b border-gray-800">
        <div class="flex flex-col items-center space-y-2">
            <img src="image.jpg" alt="For-U Logo" class="w-16 h-16 object-cover rounded-2xl shadow-lg border border-brandYellow/30">
            <div class="text-center">
                <h1 class="text-xl font-bold tracking-wider">فور يو <span class="text-brandYellow text-sm">For-U</span></h1>
                <p class="text-xs text-gray-400">توصيل طلباتك بسرعة وأمان</p>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="max-w-md w-full">
            
            <!-- نافذة تسجيل الدخول / حساب المستخدم في المنتصف -->
            <div class="bg-brandCard border border-gray-800 rounded-3xl p-8 shadow-2xl relative">
                
                <div class="text-center mb-6">
                    <h3 id="modalTitle" class="text-2xl font-bold">تسجيل الدخول</h3>
                    <p id="modalSubtitle" class="text-xs text-gray-400 mt-1">اختر طريقة تسجيل الدخول المناسبة</p>
                </div>

                <!-- حاوية تسجيل الدخول (تختفي بعد الدخول) -->
                <div id="loginSection">
                    <!-- خيارات التسجيل السريع (غوغل) -->
                    <div class="space-y-3 mb-4">
                        <button type="button" onclick="loginWithGoogle()" class="w-full bg-white text-gray-900 font-bold py-3 px-4 rounded-xl hover:bg-gray-100 transition shadow flex items-center justify-center space-x-2 space-x-reverse">
                            <i class="fa-brands fa-google text-red-500 text-lg ml-2"></i>
                            <span>التسجيل عبر حساب غوغل</span>
                        </button>
                    </div>

                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-gray-700"></div>
                        <span class="flex-shrink mx-4 text-gray-500 text-xs">أو بالبريد الإلكتروني</span>
                        <div class="flex-grow border-t border-gray-700"></div>
                    </div>

                    <!-- الطريقة التقليدية (البريد الإلكتروني وكلمة المرور) -->
                    <form id="authForm" class="space-y-4 mt-3" onsubmit="handleEmailAuth(event)" autocomplete="off">
                        <input type="text" style="display:none" name="fakeusernameremembered">
                        <input type="password" style="display:none" name="fakepasswordremembered">

                        <div id="nameFieldContainer" class="hidden">
                            <label class="block text-sm text-gray-300 mb-1">الاسم الكامل</label>
                            <input type="text" id="fullName" autocomplete="off" spellcheck="false" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-brandYellow outline-none transition" placeholder="محمد أحمد">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">البريد الإلكتروني</label>
                            <input type="email" id="email" required autocomplete="off" spellcheck="false" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-brandYellow outline-none transition" placeholder="name@foru.com">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">كلمة المرور</label>
                            <input type="password" id="password" required autocomplete="new-password" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-3 text-white focus:border-brandYellow outline-none transition" placeholder="••••••••">
                        </div>
                        <button type="submit" id="submitBtnText" class="w-full bg-brandYellow text-brandDark font-bold py-3.5 rounded-xl hover:bg-yellow-400 transition shadow-lg mt-2">
                            دخول بالنظام
                        </button>
                    </form>

                    <!-- التبديل بين الدخول وإنشاء الحساب للبريد -->
                    <div class="text-center mt-5 text-sm text-gray-400">
                        <span id="switchPrompt">ليس لديك حساب؟</span>
                        <button type="button" onclick="toggleAuthMode()" id="switchBtnText" class="text-brandYellow font-bold mr-1 hover:underline">إنشاء حساب جديد</button>
                    </div>
                </div>

                <!-- حالة المستخدم بعد تسجيل الدخول (تظهر فقط بعد الدخول) -->
                <div id="userProfileDisplay" class="hidden flex-col items-center space-y-4 py-2">
                    <div class="w-16 h-16 bg-brandYellow/10 border border-brandYellow/30 rounded-2xl flex items-center justify-center text-brandYellow text-2xl font-bold">
                        <i class="fa-solid fa-user-check"></i>
                    </div>
                    <span id="userEmailSpan" class="text-sm text-brandYellow font-semibold text-center break-all"></span>
                    <button onclick="logoutUser()" class="w-full bg-red-500/20 border border-red-500/50 text-red-400 text-sm font-bold py-3 rounded-xl hover:bg-red-500/30 transition shadow">
                        تسجيل الخروج
                    </button>
                </div>

            </div>

        </div>
    </main>

    <!-- الفوتر فارغ -->
    <footer></footer>

    <!-- سكريبت التحكم والربط -->
    <script>
        let currentMode = 'login';

        // إعدادات Firebase الخاصة بالمشروع الحالي
        const firebaseConfig = {
            apiKey: "AIzaSyACLchq_aV7AT4wqznXIOv395Nbkeemc_c",
            authDomain: "ai-sales-a92b9.firebaseapp.com",
            projectId: "ai-sales-a92b9",
            storageBucket: "ai-sales-a92b9.firebasestorage.app",
            messagingSenderId: "100700395015",
            appId: "1:100700395015:web:79760bc1425b693d3a3ca2",
            measurementId: "G-KN8CS68W7Q"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        // فحص بيانات الجلسة عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            auth.getRedirectResult()
                .then((result) => {
                    if (result.user) {
                        const user = result.user;
                        localStorage.setItem('foru_user_email', user.email);
                        updateUIAfterLogin(user.email);
                    }
                })
                .catch((error) => {
                    console.error('Google Redirect Error:', error);
                });

            const savedEmail = localStorage.getItem('foru_user_email');
            if (savedEmail) {
                updateUIAfterLogin(savedEmail);
            } else {
                auth.onAuthStateChanged(user => {
                    if (user) {
                        localStorage.setItem('foru_user_email', user.email);
                        updateUIAfterLogin(user.email);
                    }
                });
            }
        });

        function updateUIAfterLogin(identifier) {
            // إخفاء نموذج تسجيل الدخول بالكامل
            document.getElementById('loginSection').classList.add('hidden');
            
            // تحديث عناوين البطاقة لتصبح خاصة بحساب المستخدم
            document.getElementById('modalTitle').innerText = 'حسابي';
            document.getElementById('modalSubtitle').innerText = 'تم تسجيل الدخول بنجاح';

            // إظهار بطاقة معلومات المستخدم وزر الخروج
            const profileDisplay = document.getElementById('userProfileDisplay');
            profileDisplay.classList.remove('hidden');
            profileDisplay.classList.add('flex');
            document.getElementById('userEmailSpan').innerText = identifier;
        }

        function toggleAuthMode() {
            currentMode = currentMode === 'login' ? 'register' : 'login';
            updateModalUI();
        }

        function updateModalUI() {
            const title = document.getElementById('modalTitle');
            const nameField = document.getElementById('nameFieldContainer');
            const submitBtn = document.getElementById('submitBtnText');
            const switchPrompt = document.getElementById('switchPrompt');
            const switchBtn = document.getElementById('switchBtnText');

            if (currentMode === 'register') {
                title.innerText = 'إنشاء حساب بالبريد';
                nameField.classList.remove('hidden');
                submitBtn.innerText = 'تسجيل الحساب';
                switchPrompt.innerText = 'لديك حساب بالفعل؟';
                switchBtn.innerText = 'تسجيل الدخول';
            } else {
                title.innerText = 'تسجيل الدخول';
                nameField.classList.add('hidden');
                submitBtn.innerText = 'دخول بالنظام';
                switchPrompt.innerText = 'ليس لديك حساب؟';
                switchBtn.innerText = 'إنشاء حساب جديد';
            }
        }

        // 1. تسجيل الدخول عبر غوغل
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider);
        }

        // 2. تسجيل الدخول أو إنشاء حساب بالبريد الإلكتروني وكلمة المرور
        function handleEmailAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (currentMode === 'register') {
                auth.createUserWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        const user = userCredential.user;
                        localStorage.setItem('foru_user_email', user.email);
                        updateUIAfterLogin(user.email);
                    })
                    .catch((error) => {
                        alert('❌ خطأ في إنشاء الحساب: ' + error.message);
                    });
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        const user = userCredential.user;
                        localStorage.setItem('foru_user_email', user.email);
                        updateUIAfterLogin(user.email);
                    })
                    .catch((error) => {
                        alert('❌ خطأ في البريد أو كلمة المرور: ' + error.message);
                    });
            }
        }

        // تسجيل الخروج
        function logoutUser() {
            auth.signOut().then(() => {
                localStorage.removeItem('foru_user_email');
                location.reload();
            });
        }
    </script>
</body>
</html>
