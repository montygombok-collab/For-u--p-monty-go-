<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For-U | فور يو - نصلك قبل ما تطلب</title>
    
    <!-- الوسوم الخاصة بإظهار شعار المنصة -->
    <link rel="icon" type="image/png" href="image.jpg">
    <link rel="apple-touch-icon" href="image.jpg">
    <meta name="apple-mobile-web-app-title" content="For-U">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #121212; color: #ffffff; } 
    </style>
</head>
<body class="bg-[#121212] text-white h-screen flex flex-col justify-between selection:bg-[#FFB800] selection:text-[#121212]">

    <!-- شاشة التحميل (تختفي فوراً بضمان زمني لمنع التعليق) -->
    <div id="loadingOverlay" class="fixed inset-0 bg-[#121212] z-50 flex flex-col items-center justify-center space-y-4 transition-opacity duration-300">
        <div class="w-16 h-16 border-4 border-[#FFB800]/20 border-t-[#FFB800] rounded-full animate-spin"></div>
        <p class="text-[#FFB800] font-bold text-sm tracking-wide animate-pulse">جاري التحميل...</p>
    </div>

    <!-- الهيدر العلوي -->
    <header class="p-4 sm:p-6 flex justify-between items-center border-b border-gray-800/60">
        <div class="flex items-center space-x-2 space-x-reverse">
            <div id="userProfileDisplay" class="hidden items-center space-x-2 space-x-reverse bg-[#1E1E1E] border border-gray-800 px-3 py-1.5 rounded-xl shadow-lg">
                <i class="fa-solid fa-circle-user text-[#FFB800] text-lg"></i>
                <span id="userNameSpan" class="text-xs text-white font-semibold"></span>
                <button onclick="logoutUser()" class="bg-red-500/25 border border-red-500/50 text-red-400 text-xs font-bold px-2.5 py-1 rounded-lg hover:bg-red-500/30 transition mr-1">
                    خروج
                </button>
            </div>
        </div>

        <div class="flex space-x-2 space-x-reverse items-center">
            <div id="authButtonsContainer" class="flex space-x-2 space-x-reverse">
                <button id="loginHeaderBtn" onclick="openAuthModal('login')" class="bg-[#1E1E1E] border border-gray-700 text-[#FFB800] text-sm font-bold px-4 py-2 rounded-xl hover:bg-gray-800 transition shadow-md flex items-center">
                    <i class="fa-solid fa-right-to-bracket ml-2"></i> تسجيل الدخول
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow flex items-center justify-center px-6 overflow-y-auto py-4">
        <div class="max-w-md w-full text-center flex flex-col items-center">
            
            <span class="bg-[#FFB800]/10 text-[#FFB800] text-xs font-semibold px-3 py-1 rounded-full border border-[#FFB800]/20 inline-block mb-3">
                🚀 نصلك قبل ما تطلب 
            </span>

            <div class="mb-4 flex flex-col items-center">
                <img src="image.jpg" alt="For-U Logo" class="w-20 h-20 object-cover rounded-2xl shadow-2xl border-2 border-[#FFB800]/40 mb-3 animate-pulse">
                <h1 class="text-3xl font-black tracking-wider mb-1">فور يو <span class="text-[#FFB800] text-base">FOR-U</span></h1>
                <p class="text-xs text-gray-400">توصيل طلباتك بسرعة وأمان</p>
            </div>

            <p class="text-gray-400 text-sm mb-6 max-w-sm leading-relaxed">
                اطلب توصيل لطلباتك واعثر على أفضل المنتجات والخدمات
            </p>

            <div class="w-full flex flex-col space-y-3">
                <div id="centerActionContainer" class="flex flex-col space-y-3">
                    <button id="mainAuthActionBtn" onclick="openAuthModal('login')" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3.5 px-6 rounded-2xl hover:bg-yellow-400 transition shadow-lg flex items-center justify-center text-sm">
                        <i class="fa-solid fa-box-open ml-2"></i> ابدأ الآن / تسجيل الدخول
                    </button>
                </div>

                <!-- الخدمات المتاحة بعد الدخول -->
                <div id="loggedServicesContainer" class="hidden flex flex-col space-y-3 w-full">
                    <button onclick="window.location.href='customer.html'" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3.5 px-6 rounded-2xl hover:bg-yellow-400 transition shadow-lg flex items-center justify-center text-sm">
                        <i class="fa-solid fa-cart-shopping ml-2"></i> اطلب توصيل
                    </button>
                    <button onclick="window.location.href='track.html'" class="w-full bg-[#1E1E1E] border border-gray-700 text-white font-bold py-3.5 px-6 rounded-2xl hover:bg-gray-800 transition shadow-lg flex items-center justify-center text-sm">
                        <i class="fa-solid fa-location-crosshairs ml-2"></i> تتبع طلب
                    </button>
                    <button onclick="window.location.href='marketplace.html'" class="w-full bg-[#1E1E1E] border border-[#FFB800] text-[#FFB800] font-bold py-3.5 px-6 rounded-2xl hover:bg-[#FFB800]/10 transition shadow-lg flex items-center justify-center text-sm">
                        <i class="fa-solid fa-store ml-2"></i> السوق
                    </button>
                    <button onclick="window.location.href='store-dashboard.html'" class="w-full bg-[#1E1E1E] border border-gray-600 text-gray-300 font-bold py-3.5 px-6 rounded-2xl hover:bg-gray-800 transition shadow-lg flex items-center justify-center text-sm">
                        <i class="fa-solid fa-shop ml-2"></i> اعرض متجرك
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- نافذة المصادقة -->
    <div id="authModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#1E1E1E] border border-gray-800 rounded-3xl p-6 max-w-md w-full relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="text-center mb-5">
                <img src="image.jpg" alt="For-U Logo" class="w-14 h-14 object-cover mx-auto rounded-xl mb-2 shadow-lg border border-[#FFB800]/30">
                <h3 id="modalTitle" class="text-xl font-bold">تسجيل الدخول / إنشاء حساب</h3>
                <p id="modalSubtitle" class="text-xs text-gray-400 mt-1">يرجى تسجيل الدخول والمضي قدماً</p>
            </div>

            <div class="space-y-3 mb-3">
                <button type="button" onclick="loginWithGoogle()" class="w-full bg-white text-gray-800 font-bold py-3 px-4 rounded-xl hover:bg-gray-100 transition shadow flex items-center justify-center space-x-3 space-x-reverse text-sm">
                    <i class="fa-brands fa-google text-red-500 text-lg"></i>
                    <span>المتابعة بواسطة Google</span>
                </button>
                <button type="button" onclick="loginWithFacebook()" class="w-full bg-[#1877f2] text-white font-bold py-3 px-4 rounded-xl hover:bg-[#166fe5] transition shadow flex items-center justify-center space-x-3 space-x-reverse text-sm">
                    <i class="fa-brands fa-facebook-f text-white text-lg"></i>
                    <span>المتابعة بواسطة Facebook</span>
                </button>
            </div>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-gray-700"></div>
                <span class="flex-shrink mx-4 text-gray-500 text-xs">أو بالبريد الإلكتروني</span>
                <div class="flex-grow border-t border-gray-700"></div>
            </div>

            <form id="authForm" class="space-y-3 mt-2" onsubmit="handleEmailAuth(event)">
                <div id="nameFieldContainer" class="hidden">
                    <label class="block text-xs text-gray-300 mb-1">الاسم الكامل</label>
                    <input type="text" id="fullName" class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="محمد أحمد">
                </div>

                <!-- قائمة ولايات السودان -->
                <div id="stateFieldContainer" class="hidden">
                    <label class="block text-xs text-gray-300 mb-1">الولاية</label>
                    <select id="userState" class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition">
                        <option value="" disabled selected>اختر ولايتك</option>
                        <option value="الخرطوم">ولاية الخرطوم</option>
                        <option value="نهر النيل">ولاية نهر النيل</option>
                        <option value="البحر الأحمر">ولاية البحر الأحمر</option>
                        <option value="الشمالية">الولاية الشمالية</option>
                        <option value="كسلا">ولاية كسلا</option>
                        <option value="القضارف">ولاية القضارف</option>
                        <option value="سنار">ولاية سنار</option>
                        <option value="النيل الأبيض">ولاية النيل الأبيض</option>
                        <option value="النيل الأزرق">ولاية النيل الأزرق</option>
                        <option value="الجزيرة">ولاية الجزيرة</option>
                        <option value="شمال كردفان">شمال كردفان</option>
                        <option value="غرب كردفان">غرب كردفان</option>
                        <option value="جنوب كردفان">جنوب كردفان</option>
                        <option value="شمال دارفور">شمال دارفور</option>
                        <option value="جنوب دارفور">جنوب دارفور</option>
                        <option value="شرق دارفور">شرق دارفور</option>
                        <option value="غرب دارفور">غرب دارفور</option>
                        <option value="وسط دارفور">وسط دارفور</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-gray-300 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="name@foru.com">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#FFB800] outline-none transition" placeholder="••••••••">
                </div>
                <button type="submit" id="submitBtnText" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg mt-1 text-sm">
                    دخول 
                </button>
            </form>

            <div class="text-center mt-4 text-xs text-gray-400">
                <span id="switchPrompt">ليس لديك حساب؟</span>
                <button type="button" onclick="toggleAuthMode()" id="switchBtnText" class="text-[#FFB800] font-bold mr-1 hover:underline">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <!-- نافذة التنبيه -->
    <div id="customAlertModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#1E1E1E] border border-gray-800 rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl">
            <div id="alertIconContainer" class="w-16 h-16 bg-[#FFB800]/10 border border-[#FFB800]/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-[#FFB800] text-2xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h4 id="alertTitle" class="text-xl font-bold mb-2">تنبيه النظام</h4>
            <p id="alertMessage" class="text-gray-300 text-sm mb-6 leading-relaxed">رسالة التنبيه...</p>
            <button onclick="closeCustomAlert()" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg">حسنًا</button>
        </div>
    </div>

    <!-- دوال واجهة المستخدم الأساسية -->
    <script>
        let currentMode = 'login';

        function removeLoader() {
            const loader = document.getElementById('loadingOverlay');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 300);
            }
        }

        setTimeout(removeLoader, 1500);

        window.showCustomAlert = function(title, message) {
            const titleEl = document.getElementById('alertTitle');
            const msgEl = document.getElementById('alertMessage');
            if(titleEl) titleEl.innerText = title;
            if(msgEl) msgEl.innerText = message;
            const alertModal = document.getElementById('customAlertModal');
            if(alertModal) {
                alertModal.classList.remove('hidden');
                alertModal.classList.add('flex');
            }
        };

        window.closeCustomAlert = function() {
            const alertModal = document.getElementById('customAlertModal');
            if(alertModal) {
                alertModal.classList.remove('flex');
                alertModal.classList.add('hidden');
            }
        };

        window.openAuthModal = function(mode) {
            currentMode = mode;
            updateModalUI();
            const modal = document.getElementById('authModal');
            if(modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        };

        window.toggleAuthMode = function() {
            currentMode = currentMode === 'login' ? 'register' : 'login';
            updateModalUI();
        };

        function updateModalUI() {
            const title = document.getElementById('modalTitle');
            const nameField = document.getElementById('nameFieldContainer');
            const stateField = document.getElementById('stateFieldContainer');
            const submitBtn = document.getElementById('submitBtnText');
            const switchPrompt = document.getElementById('switchPrompt');
            const switchBtn = document.getElementById('switchBtnText');

            if (!title) return;

            if (currentMode === 'register') {
                title.innerText = 'إنشاء حساب جديد';
                if(nameField) nameField.classList.remove('hidden');
                if(stateField) nameField.classList.remove('hidden');
                if(submitBtn) submitBtn.innerText = 'تسجيل الحساب';
                if(switchPrompt) switchPrompt.innerText = 'لديك حساب بالفعل؟';
                if(switchBtn) switchBtn.innerText = 'تسجيل الدخول';
            } else {
                title.innerText = 'تسجيل الدخول';
                if(nameField) nameField.classList.add('hidden');
                if(stateField) nameField.classList.add('hidden');
                if(submitBtn) submitBtn.innerText = 'دخول بالنظام';
                if(switchPrompt) switchPrompt.innerText = 'ليس لديك حساب؟';
                if(switchBtn) switchBtn.innerText = 'إنشاء حساب جديد';
            }
        }
    </script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            GoogleAuthProvider,
            FacebookAuthProvider,
            signInWithPopup,
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-5YFGfzldH3OyWOH7z96vCbUd0isw6aM",
            authDomain: "for-u-56f3f.firebaseapp.com",
            projectId: "for-u-56f3f",
            storageBucket: "for-u-56f3f.firebasestorage.app",
            messagingSenderId: "519930793199",
            appId: "1:519930793199:web:0c876d149832cd0a8d5f1a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        setPersistence(auth, browserLocalPersistence).catch(console.error);

        async function handleUserSessionUI(user, customName = '', customState = 'غير محدد') {
            try {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                let role = 'عميل'; 
                let userName = customName || user.displayName || (user.email ? user.email.split('@')[0] : 'مستخدم');
                let userState = customState;

                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    role = userData.role || 'عميل';
                    userName = userData.name || userName;
                    userState = userData.state || userState;
                } else {
                    await setDoc(userRef, {
                        uid: user.uid,
                        name: userName,
                        email: user.email || '',
                        phone: 'غير مسجل',
                        state: userState,
                        role: 'عميل',
                        createdAt: new Date().toISOString()
                    });
                }

                localStorage.setItem('foru_user_name', userName);
                localStorage.setItem('foru_user_email', user.email || '');
                localStorage.setItem('foru_user_role', role);
                localStorage.setItem('foru_user_state', userState);

                const cleanRole = role.trim();
                if (cleanRole === 'مندوب توصيل' || cleanRole === 'مندوب') {
                    window.location.replace('driver.html');
                    return;
                } else if (cleanRole.includes('مدير') || cleanRole.includes('مشرف') || cleanRole === 'admin') {
                    window.location.replace('dashboard.html');
                    return;
                } else if (cleanRole === 'مسوقين' || cleanRole === 'مسوق') {
                    window.location.replace('Marketers.html');
                    return;
                }

                const nameSpan = document.getElementById('userNameSpan');
                const profileDisplay = document.getElementById('userProfileDisplay');
                const loginHeaderBtn = document.getElementById('loginHeaderBtn');
                const mainActionBtn = document.getElementById('mainAuthActionBtn');
                const loggedServices = document.getElementById('loggedServicesContainer');
                const authModal = document.getElementById('authModal');

                if(nameSpan) nameSpan.innerText = userName + (userState ? ` (${userState})` : '');
                if(profileDisplay) {
                    profileDisplay.classList.remove('hidden');
                    profileDisplay.classList.add('flex');
                }
                if(loginHeaderBtn) loginHeaderBtn.style.display = 'none';
                if(mainActionBtn) mainActionBtn.style.display = 'none';
                if(loggedServices) {
                    loggedServices.classList.remove('hidden');
                    loggedServices.classList.add('flex');
                }
                if(authModal) {
                    authModal.classList.remove('flex');
                    authModal.classList.add('hidden');
                }

                removeLoader();

            } catch (error) {
                console.error("خطأ في جلب بيانات المستخدم:", error);
                removeLoader();
            }
        }

        window.loginWithGoogle = function() {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider)
                .then(async (result) => {
                    if (result && result.user) {
                        await handleUserSessionUI(result.user);
                    }
                })
                .catch((error) => {
                    showCustomAlert('خطأ في تسجيل الدخول', '❌ خطأ: ' + error.message);
                });
        };

        window.loginWithFacebook = function() {
            const provider = new FacebookAuthProvider();
            signInWithPopup(auth, provider)
                .then(async (result) => {
                    if (result && result.user) {
                        await handleUserSessionUI(result.user);
                    }
                })
                .catch((error) => {
                    showCustomAlert('خطأ في تسجيل الدخول', '❌ خطأ: ' + error.message);
                });
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await handleUserSessionUI(user);
            } else {
                removeLoader();
            }
        });

        // دالة الدخول / الإنشاء الذكية الموحدة (تسجل دخول بأي طريقة سواء كان الحساب موجوداً أو تم إنشاؤه الآن)
        window.handleEmailAuth = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const customNameInput = document.getElementById('fullName').value.trim() || email.split('@')[0];
            const selectedState = document.getElementById('userState').value || 'غير محدد';

            try {
                // المحاولة الأولى: محاولة إنشاء الحساب الجديد
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await handleUserSessionUI(userCredential.user, customNameInput, selectedState);
            } catch (error) {
                // إذا كان الحساب موجوداً مسبقاً، يقوم النظام فوراً بتسجيل الدخول بدلاً من إظهار أي خطأ
                if (error.code === 'auth/email-already-in-use') {
                    try {
                        const loginCredential = await signInWithEmailAndPassword(auth, email, password);
                        await handleUserSessionUI(loginCredential.user);
                    } catch (loginError) {
                        showCustomAlert('تنبيه', 'كلمة المرور غير صحيحة لهذا البريد المسجل مسبقاً.');
                    }
                } else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    // إذا كان في وضع الدخول وكلمة المرور خطأ
                    try {
                        const loginCredential = await signInWithEmailAndPassword(auth, email, password);
                        await handleUserSessionUI(loginCredential.user);
                    } catch (e) {
                        showCustomAlert('تنبيه', 'البريد الإلكتروني أو كلمة المرور غير صحيحة.');
                    }
                } else if (error.code === 'auth/weak-password') {
                    showCustomAlert('تنبيه', 'كلمة المرور قصيرة جداً، يجب أن تكون 6 أحرف على الأقل.');
                } else {
                    // كحل احتياطي نهائي، حاول الدخول مباشرة إذا فشل الإنشاء لأي سبب آخر
                    try {
                        const loginCredential = await signInWithEmailAndPassword(auth, email, password);
                        await handleUserSessionUI(loginCredential.user);
                    } catch (finalError) {
                        showCustomAlert('تنبيه', 'حدث خطأ في عملية الدخول. تأكد من صحة البريد وكلمة المرور.');
                    }
                }
            }
        };

        window.logoutUser = function() {
            signOut(auth).then(() => {
                localStorage.clear();
                window.location.reload();
            });
        };
    </script>
</body>
</html>
