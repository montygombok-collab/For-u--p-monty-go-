<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة عمليات الميدان - مناديب التوصيل | For-U</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FFB800',
                        brandDark: '#121212',
                        brandCard: '#1E1E1E'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-brandDark text-white min-h-screen flex flex-col justify-between">

    <!-- الهيدر -->
    <header class="p-4 md:p-6 flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="bg-brandYellow text-brandDark font-black text-xl px-3 py-1 rounded-xl">4U</div>
            <div>
                <h1 id="panelTitle" class="text-lg font-bold">بوابة مناديب التوصيل الميداني</h1>
                <p id="userRoleSubtitle" class="text-xs text-brandYellow">جارٍ التحقق من الصلاحية...</p>
            </div>
        </div>
        <button onclick="logout()" class="text-gray-400 hover:text-red-400 text-sm flex items-center bg-brandCard border border-gray-700 px-3 py-2 rounded-xl">
            <i class="fa-solid fa-right-from-bracket ml-1"></i> خروج
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        <div id="driverView" class="space-y-6">
            <div class="bg-brandCard border border-gray-800 p-6 rounded-3xl shadow-xl">
                <h2 class="text-xl font-bold mb-4 flex items-center text-brandYellow border-b border-gray-700 pb-3">
                    <i class="fa-solid fa-motorcycle ml-2"></i> كافة الطلبات المتاحة (اختر الطلب الذي تريد إنجازه وتوصيله)
                </h2>
                <div class="space-y-6" id="driverOrdersList">
                    <div class="bg-brandDark border border-gray-700 p-4 rounded-2xl text-center text-gray-400">
                        جاري جلب كافة الطلبات والخرائط...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- نافذة التنبيهات المخصصة -->
    <div id="customAlertModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-brandCard border border-gray-800 rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl">
            <h4 id="alertTitle" class="text-xl font-bold mb-2 text-brandYellow">تنبيه النظام</h4>
            <p id="alertMessage" class="text-gray-300 text-sm mb-6 leading-relaxed">رسالة...</p>
            <button onclick="closeCustomAlert()" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg text-sm">
                حسنًا
            </button>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="p-4 text-center border-t border-gray-800 text-gray-500 text-sm">
        جميع الحقوق محفوظة &copy; 2026 For-U Ecosystem
    </footer>

    <!-- ربط Firebase والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-5YFGfzldH3OyWOH7z96vCbUd0isw6aM",
            authDomain: "for-u-56f3f.firebaseapp.com",
            projectId: "for-u-56f3f",
            storageBucket: "for-u-56f3f.firebasestorage.app",
            messagingSenderId: "519930793199",
            appId: "1:519930793199:web:0c876d149832cd0a8d5f1a",
            measurementId: "G-2ZV3NGRYZG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentDriverName = '';

        window.showCustomAlert = function(title, message) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        window.closeCustomAlert = function() {
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // التحقق من الصلاحية ومسمى المندوب
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);

                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        const role = userData.role || '';
                        currentDriverName = userData.name || userData.fullName || user.email.split('@')[0];

                        if (role !== 'مندوب توصيل' && role !== 'driver') {
                            showCustomAlert('غير مصرح', 'عذراً، هذه الصفحة مخصصة لمناديب التوصيل فقط.');
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 2000);
                            return;
                        }

                        document.getElementById('userRoleSubtitle').innerText = `المندوب: ${currentDriverName} (صلاحية: مندوب توصيل)`;
                        fetchAllAvailableOrders();
                    } else {
                        showCustomAlert('خطأ', 'لم يتم العثور على بيانات الحساب.');
                        window.location.href = 'index.html';
                    }
                } catch (err) {
                    console.error("خطأ في التحقق من الصلاحية:", err);
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        // جلب كافة الطلبات غير المنجزة ليختار منها المندوب
        async function fetchAllAvailableOrders() {
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                const ordersListContainer = document.getElementById('driverOrdersList');
                ordersListContainer.innerHTML = '';

                let availableOrders = [];
                querySnapshot.forEach((docSnap) => {
                    const orderData = docSnap.data();
                    if (orderData.status !== 'منجز') {
                        availableOrders.push({ id: docSnap.id, ...orderData });
                    }
                });

                if (availableOrders.length === 0) {
                    ordersListContainer.innerHTML = `
                        <div class="bg-brandDark border border-gray-700 p-6 rounded-2xl text-center text-gray-400">
                            <i class="fa-solid fa-box-open text-3xl mb-2 text-gray-500"></i>
                            <p>لا توجد طلبات متاحة للتوصيل حالياً في النظام.</p>
                        </div>
                    `;
                    return;
                }

                availableOrders.forEach(order => {
                    const deliveryLocation = order.address || order.location || 'Khartoum, Sudan';
                    const mapSrc = `https://maps.google.com/maps?q=${encodeURIComponent(deliveryLocation)}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
                    const isAssignedToMe = order.assignedDriver === currentDriverName;

                    ordersListContainer.innerHTML += `
                        <div class="bg-brandDark border ${isAssignedToMe ? 'border-brandYellow' : 'border-gray-700'} p-5 rounded-2xl space-y-4 shadow-md">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="space-y-1">
                                    <div class="flex items-center gap-2">
                                        <span class="bg-yellow-500/10 text-brandYellow text-xs px-2.5 py-1 rounded-lg border border-yellow-500/20 font-bold">${order.status || 'قيد الانتظار'}</span>
                                        ${isAssignedToMe ? '<span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-500/30 font-bold">مسند إليك</span>' : ''}
                                    </div>
                                    <h3 class="font-bold text-base mt-2">عميل: ${order.clientName || 'غير متوفر'}</h3>
                                    <p class="text-xs text-gray-400">الوصف: ${order.description || 'طلب توصيل سحابي'}</p>
                                    <p class="text-xs text-gray-400">العنوان: <span class="text-white">${deliveryLocation}</span></p>
                                    <p class="text-xs text-gray-400">رقم الهاتف: <span class="text-white font-bold">${order.clientPhone || 'غير متوفر'}</span></p>
                                    <p class="text-xs text-brandYellow font-semibold">المبلغ المطلوب تحصيله: ${(order.cost || 0).toLocaleString()} جنيه</p>
                                </div>
                                
                                <div class="w-full md:w-auto flex flex-col gap-2 min-w-[160px]">
                                    <button onclick="claimOrder('${order.id}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow flex items-center justify-center">
                                        <i class="fa-solid fa-hand ml-1.5"></i> اختيار / أنا سأقوم به
                                    </button>
                                    <button onclick="updateOrderStatus('${order.id}')" class="bg-green-600 hover:bg-green-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow flex items-center justify-center">
                                        <i class="fa-solid fa-check ml-1.5"></i> تم التسليم / إنجاز
                                    </button>
                                </div>
                            </div>

                            <!-- خريطة موقع العميل -->
                            <div class="space-y-1 pt-2 border-t border-gray-800">
                                <p class="text-xs text-gray-400 flex items-center mb-1">
                                    <i class="fa-solid fa-map-location-dot text-brandYellow ml-1"></i> خريطة موقع العميل المفترض الوصول إليه:
                                </p>
                                <div class="w-full h-40 rounded-xl overflow-hidden border border-gray-700">
                                    <iframe width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="${mapSrc}"></iframe>
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error("خطأ في جلب الطلبات:", error);
                document.getElementById('driverOrdersList').innerHTML = `<p class="text-center text-red-400">حدث خطأ أثناء تحميل الطلبات.</p>`;
            }
        }

        // اختيار المندوب للطلب وتسجيل اسمه عليه
        window.claimOrder = async function(orderId) {
            try {
                await updateDoc(doc(db, "orders", orderId), {
                    assignedDriver: currentDriverName,
                    status: 'قيد التوصيل'
                });
                showCustomAlert('تم الاختيار', 'تم تسجيل هذا الطلب باسمك بنجاح.');
                fetchAllAvailableOrders();
            } catch (err) {
                console.error(err);
                showCustomAlert('خطأ', 'فشل اختيار الطلب.');
            }
        }

        // تحديث حالة الطلب إلى "منجز"
        window.updateOrderStatus = async function(orderId) {
            try {
                await updateDoc(doc(db, "orders", orderId), {
                    status: 'منجز'
                });
                showCustomAlert('تم بنجاح', 'تم تحديث حالة الطلب إلى (منجز) بنجاح.');
                fetchAllAvailableOrders();
            } catch (err) {
                console.error(err);
                showCustomAlert('خطأ', 'فشل تحديث حالة الطلب.');
            }
        }

        window.logout = function() {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
