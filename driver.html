<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة عمليات الميدان - مناديب التوصيل | For-U</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FFB800',
                        brandDark: '#121212',
                        brandCard: '#1E1E1E'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-brandDark text-white min-h-screen flex flex-col justify-between">

    <!-- الهيدر -->
    <header class="p-4 md:p-6 flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="bg-brandYellow text-brandDark font-black text-xl px-3 py-1 rounded-xl">4U</div>
            <div>
                <h1 id="panelTitle" class="text-lg font-bold">بوابة مناديب التوصيل الميداني</h1>
                <p id="userRoleSubtitle" class="text-xs text-brandYellow">جارٍ التحقق من الصلاحية...</p>
            </div>
        </div>
        <button onclick="logout()" class="text-gray-400 hover:text-red-400 text-sm flex items-center bg-brandCard border border-gray-700 px-3 py-2 rounded-xl">
            <i class="fa-solid fa-right-from-bracket ml-1"></i> خروج
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        <div id="driverView" class="space-y-6">
            <div class="bg-brandCard border border-gray-800 p-6 rounded-3xl shadow-xl">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
                    <h2 class="text-xl font-bold flex items-center text-brandYellow">
                        <i class="fa-solid fa-motorcycle ml-2"></i> ساحة الطلبات العامة المتاحة للتوصيل
                    </h2>
                    <button onclick="fetchAllAvailableOrders()" class="bg-brandDark border border-gray-700 text-xs px-3 py-1.5 rounded-xl text-gray-300 hover:text-brandYellow transition">
                        <i class="fa-solid fa-rotate ml-1"></i> تحديث القائمة
                    </button>
                </div>
                <div class="space-y-6" id="driverOrdersList">
                    <div class="bg-brandDark border border-gray-700 p-4 rounded-2xl text-center text-gray-400">
                        جاري جلب الطلبات المتاحة...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- نافذة التنبيهات المخصصة -->
    <div id="customAlertModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-brandCard border border-gray-800 rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl">
            <h4 id="alertTitle" class="text-xl font-bold mb-2 text-brandYellow">تنبيه النظام</h4>
            <p id="alertMessage" class="text-gray-300 text-sm mb-6 leading-relaxed">رسالة...</p>
            <button onclick="closeCustomAlert()" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg text-sm">
                حسنًا
            </button>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="p-4 text-center border-t border-gray-800 text-gray-500 text-sm">
        جميع الحقوق محفوظة &copy; 2026 For-U Ecosystem
    </footer>

    <!-- ربط Firebase وجلب الطلبات العامة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-5YFGfzldH3OyWOH7z96vCbUd0isw6aM",
            authDomain: "for-u-56f3f.firebaseapp.com",
            projectId: "for-u-56f3f",
            storageBucket: "for-u-56f3f.firebasestorage.app",
            messagingSenderId: "519930793199",
            appId: "1:519930793199:web:0c876d149832cd0a8d5f1a",
            measurementId: "G-2ZV3NGRYZG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentDriverName = '';

        window.showCustomAlert = function(title, message) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        window.closeCustomAlert = function() {
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);

                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        const role = userData.role || '';
                        currentDriverName = userData.name || userData.fullName || userData.username || user.email.split('@')[0];

                        if (role !== 'مندوب توصيل' && role !== 'driver' && role !== 'مدير النظام' && role !== 'admin') {
                            showCustomAlert('غير مصرح', 'عذراً، هذه الصفحة مخصصة لمناديب التوصيل فقط.');
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 2000);
                            return;
                        }

                        document.getElementById('userRoleSubtitle').innerText = `المندوب: ${currentDriverName} (صلاحية: ${role})`;
                        fetchAllAvailableOrders();
                    } else {
                        currentDriverName = user.email.split('@')[0];
                        document.getElementById('userRoleSubtitle').innerText = `المندوب: ${currentDriverName} (صلاحية افتراضية)`;
                        fetchAllAvailableOrders();
                    }
                } catch (err) {
                    console.error("خطأ في التحقق من الصلاحية:", err);
                    fetchAllAvailableOrders();
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        // دالة جلب كافة الطلبات
        window.fetchAllAvailableOrders = async function() {
            try {
                let firestoreOrders = [];
                try {
                    const querySnapshot = await getDocs(collection(db, "orders"));
                    querySnapshot.forEach((docSnap) => {
                        firestoreOrders.push({ id: docSnap.id, ...docSnap.data() });
                    });
                } catch (e) {
                    console.log("الاعتماد على التخزين المحلي");
                }

                const localOrders = JSON.parse(localStorage.getItem('foru_all_orders') || '[]');
                
                // دمج الطلبات وتفادي التكرار
                const combinedMap = new Map();
                firestoreOrders.forEach(o => combinedMap.set(o.orderId || o.id, o));
                localOrders.forEach(o => {
                    if (!combinedMap.has(o.orderId)) combinedMap.set(o.orderId, o);
                });

                const allOrders = Array.from(combinedMap.values());
                const ordersListContainer = document.getElementById('driverOrdersList');
                ordersListContainer.innerHTML = '';

                // تصفية الطلبات لعرض غير المنجزة فقط
                const activeOrders = allOrders.filter(order => {
                    const status = order.status;
                    return status !== 'منجز' && status !== 'completed';
                });

                if (activeOrders.length === 0) {
                    ordersListContainer.innerHTML = `
                        <div class="bg-brandDark border border-gray-700 p-6 rounded-2xl text-center text-gray-400">
                            <i class="fa-solid fa-box-open text-3xl mb-2 text-gray-500"></i>
                            <p>لا توجد طلبات متاحة حالياً في الساحة العامة للتوصيل.</p>
                            <p class="text-xs text-gray-500 mt-1">تأكد من قيام مشرف الطلبات بإرسال الطلبات وتحديد أسعارها من لوحة التحكم.</p>
                        </div>
                    `;
                    return;
                }

                activeOrders.forEach(order => {
                    const isAssignedToMe = (order.assignedDriver === currentDriverName || order.driverName === currentDriverName);
                    
                    const latVal = order.lat ? Number(order.lat).toFixed(4) : '--';
                    const lngVal = order.lng ? Number(order.lng).toFixed(4) : '--';
                    const mapLink = (order.lat && order.lng) ? `https://www.google.com/maps?q=${order.lat},${order.lng}` : `https://maps.google.com/maps?q=${encodeURIComponent(order.address || 'Khartoum')}`;

                    ordersListContainer.innerHTML += `
                        <div class="bg-brandDark border ${isAssignedToMe ? 'border-brandYellow' : 'border-gray-700'} p-5 rounded-2xl space-y-4 shadow-md">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="space-y-1.5 w-full">
                                    <div class="flex items-center gap-2">
                                        <span class="bg-yellow-500/10 text-brandYellow text-xs px-2.5 py-1 rounded-lg border border-yellow-500/20 font-bold">${order.status === 'in_progress' ? 'جاهز للتوصيل' : (order.status || 'متاح')}</span>
                                        <span class="text-xs text-gray-400">رقم الطلب: <b class="text-white">${order.orderId || order.id}</b></span>
                                        ${isAssignedToMe ? '<span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-500/30 font-bold mr-auto">قيد التوصيل معك</span>' : ''}
                                    </div>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs pt-1 border-t border-gray-800">
                                        <div><span class="text-gray-400">العميل:</span> <span class="font-bold text-white">${order.clientName || 'غير متوفر'} (${order.clientPhone || 'بدون هاتف'})</span></div>
                                        <div><span class="text-gray-400">المتجر (المرسل):</span> <span class="font-bold text-white">${order.storeName || 'غير مسجل'} (${order.storePhone || 'بدون هاتف'})</span></div>
                                    </div>
                                    <p class="text-xs text-gray-300"><b>البضاعة:</b> ${order.description || 'توصيل طلب'}</p>
                                    <p class="text-xs text-brandYellow font-semibold">المبلغ المطلوب تحصيله: ${(order.cost || 0).toLocaleString()} جنيه</p>
                                </div>
                            </div>

                            <!-- الخريطة والزرين المُعدلين -->
                            <div class="flex flex-col md:flex-row justify-between items-center gap-3 pt-3 border-t border-gray-800">
                                <a href="${mapLink}" target="_blank" class="text-xs text-blue-400 underline flex items-center">
                                    <i class="fa-solid fa-map-location-dot ml-1.5"></i> موقع العميل (${latVal}, ${lngVal})
                                </a>
                                <div class="flex items-center gap-2 w-full md:w-auto">
                                    ${!isAssignedToMe ? `
                                        <button onclick="claimAndNavigate('${order.id}', '${order.orderId}', '${mapLink}')" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow flex items-center justify-center">
                                            <i class="fa-solid fa-location-arrow ml-1.5"></i> قبول الطلب والتوجيه للخريطة
                                        </button>
                                    ` : `
                                        <button onclick="updateOrderStatus('${order.id}', '${order.orderId}')" class="w-full md:w-auto bg-green-600 hover:bg-green-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow flex items-center justify-center">
                                            <i class="fa-solid fa-check-double ml-1.5"></i> تم التوصيل
                                        </button>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error("خطأ في جلب الطلبات:", error);
                document.getElementById('driverOrdersList').innerHTML = `<p class="text-center text-red-400">حدث خطأ أثناء تحميل الطلبات.</p>`;
            }
        }

        // دالة قبول الطلب والتوجيه الفوري إلى الخريطة
        window.claimAndNavigate = async function(docId, orderCode, mapUrl) {
            try {
                // فتح رابط الخريطة فوراً لمنع حظر النوافذ المنبثقة من المتصفح (Popup Blocker)
                const mapWindow = window.open(mapUrl, '_blank');

                let localOrders = JSON.parse(localStorage.getItem('foru_all_orders') || '[]');
                localOrders = localOrders.map(o => {
                    if (o.orderId === orderCode || o.id === docId) {
                        return { ...o, assignedDriver: currentDriverName, driverName: currentDriverName, status: 'قيد التوصيل' };
                    }
                    return o;
                });
                localStorage.setItem('foru_all_orders', JSON.stringify(localOrders));

                if (!docId.startsWith('FOR-')) {
                    await updateDoc(doc(db, "orders", docId), {
                        assignedDriver: currentDriverName,
                        driverName: currentDriverName,
                        status: 'قيد التوصيل'
                    });
                }

                fetchAllAvailableOrders();
            } catch (err) {
                console.error(err);
                showCustomAlert('خطأ', 'فشل قبول الطلب والتوجيه للخريطة.');
            }
        }

        // إنجاز وتحديث حالة الطلب عند الضغط على "تم التوصيل"
        window.updateOrderStatus = async function(docId, orderCode) {
            try {
                let localOrders = JSON.parse(localStorage.getItem('foru_all_orders') || '[]');
                localOrders = localOrders.map(o => {
                    if (o.orderId === orderCode || o.id === docId) {
                        return { ...o, status: 'completed' };
                    }
                    return o;
                });
                localStorage.setItem('foru_all_orders', JSON.stringify(localOrders));

                if (!docId.startsWith('FOR-')) {
                    await updateDoc(doc(db, "orders", docId), {
                        status: 'completed'
                    });
                }
                showCustomAlert('تم التوصيل بنجاح', 'تم إنجاز الطلب وتسليمه بنجاح.');
                fetchAllAvailableOrders();
            } catch (err) {
                console.error(err);
                showCustomAlert('خطأ', 'فشل تحديث حالة الطلب.');
            }
        }

        window.logout = function() {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
