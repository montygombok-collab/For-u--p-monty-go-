<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For-U - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- استيراد مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --brandYellow: #FFB800;
            --dark: #0f111a;
            --light: #f0f3f9;
            --radius: 16px;
        }

        body {
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1e293b;
        }

        .login-card {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h2 {
            color: #fff;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9em;
            color: #cbd5e1;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f111a;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--brandYellow);
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .btn-brand-yellow {
            background: var(--brandYellow);
            color: #121212;
        }

        .btn-brand-yellow:hover {
            background: #e5a600;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85em;
        }

        .back-home a:hover {
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>تسجيل الدخول</h2>
            <p id="sub-title">اختر نوع الحساب وأدخل بياناتك للمتابعة</p>
        </div>

        <!-- نموذج تسجيل الدخول المباشر -->
        <div class="form-group">
            <label for="accountType"><i class="fas fa-user-tag text-yellow-400"></i> نوع الحساب</label>
            <select id="accountType" class="cursor-pointer">
                <option value="store">متجر (Merchant)</option>
                <option value="individual">فرد / عميل (Individual)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني">
        </div>

        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور">
        </div>

        <button type="button" class="btn-action btn-brand-yellow" onclick="executeFirebaseLogin()">تسجيل الدخول</button>

        <div class="back-home">
            <a href="index.html"><i class="fas fa-store"></i> العودة إلى المنصة الرئيسية</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB-5YFGfzldH3OyWOH7z96vCbUd0isw6aM",
            authDomain: "for-u-56f3f.firebaseapp.com",
            databaseURL: "https://for-u-56f3f-default-rtdb.firebaseio.com",
            projectId: "for-u-56f3f",
            storageBucket: "for-u-56f3f.firebasestorage.app",
            messagingSenderId: "519930793199",
            appId: "1:519930793199:web:0c876d149832cd0a8d5f1a"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        function executeFirebaseLogin() {
            const accountType = document.getElementById('accountType').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alert("الرجاء إدخال البريد الإلكتروني وكلمة المرور.");
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    localStorage.setItem('sudanPlayUser', user.uid);
                    localStorage.setItem('selectedAccountType', accountType);
                    
                    alert("تم تسجيل الدخول بنجاح!");

                    const targetPage = localStorage.getItem('redirectAfterLogin');
                    if (targetPage) {
                        localStorage.removeItem('redirectAfterLogin');
                        window.location.href = targetPage;
                    } else {
                        // التوجيه بناءً على اختيار نوع الحساب
                        if (accountType === 'store') {
                            window.location.href = 'store-dashboard.html';
                        } else {
                            window.location.href = 'customer-profile.html';
                        }
                    }
                })
                .catch((error) => {
                    alert('خطأ في تسجيل الدخول: ' + error.message);
                });
        }
    </script>
</body>
</html>
