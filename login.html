<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Play - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- استيراد مكتبة Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4a6bff;
            --secondary: #ff5e7d;
            --dark: #0f111a;
            --light: #f0f3f9;
            --glass-card: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.75);
            --radius: 16px;
        }

        body {
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1e293b;
        }

        .login-card {
            background: var(--glass-card);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            border: 1px solid var(--glass-border);
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h2 {
            color: var(--dark);
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }

        .btn-login:hover {
            background: #3b5bdb;
        }

        .btn-sudan-play {
            width: 100%;
            padding: 12px;
            background: #db4437;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-sudan-play:hover {
            background: #c23321;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #64748b;
            font-size: 0.85em;
            position: relative;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
        }

        .back-home a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-home a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>تسجيل الدخول</h2>
            <p>مرحباً بك مجدداً في Sudan Play</p>
        </div>

        <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني">
        </div>

        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور">
        </div>

        <button type="button" class="btn-login" onclick="executeFirebaseLogin()">دخول بالبريد الإلكتروني</button>
        
        <div class="divider">أو عبر حساب المنصة</div>

        <button type="button" class="btn-sudan-play" onclick="loginWithSudanPlayAccount()">
            <i class="fab fa-google"></i> تسجيل الدخول عبر حساب سودان بلاي
        </button>

        <div class="back-home">
            <a href="index.html"><i class="fas fa-store"></i> العودة إلى المتجر الرئيسي</a>
        </div>
    </div>

    <script>
        // إعدادات Firebase الخاصة بمشروعك (استبدلها بالبيانات الفعلية إذا لم تكن مضبوطة)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // دالة التوجيه الذكي بعد النجاح
        function handleSuccessfulLogin(user) {
            localStorage.setItem('sudanPlayAdmin', user.uid);
            
            // التحقق مما إذا كان هناك صفحة مقصودة مخزنة (مثل for-you.html)
            const targetPage = localStorage.getItem('redirectAfterLogin');
            
            if (targetPage) {
                localStorage.removeItem('redirectAfterLogin');
                window.location.href = targetPage;
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        // تسجيل الدخول بالبريد وكلمة المرور
        function executeFirebaseLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("الرجاء إدخال البريد الإلكتروني وكلمة المرور.");
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    handleSuccessfulLogin(userCredential.user);
                })
                .catch((error) => {
                    alert('خطأ في تسجيل الدخول: ' + error.message);
                });
        }

        // تسجيل الدخول عبر حساب سودان بلاي (اختر الحساب بنفسك)
        function loginWithSudanPlayAccount() {
            const provider = new firebase.auth.GoogleAuthProvider();
            
            // إجبار النظام على فتح نافذة اختيار الحسابات
            provider.setCustomParameters({
                prompt: 'select_account'
            });

            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    handleSuccessfulLogin(result.user);
                })
                .catch((error) => {
                    console.error("خطأ في تسجيل الدخول:", error);
                    alert('فشل تسجيل الدخول عبر حساب سودان بلاي: ' + error.message);
                });
        }
    </script>
</body>
</html>
