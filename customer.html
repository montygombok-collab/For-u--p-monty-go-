<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب توصيل جديد | For-U</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FFB800',
                        brandDark: '#121212',
                        brandCard: '#1E1E1E'
                    }
                }
            }
        }
    </script>
    <!-- Leaflet CSS للخرائط المجانية -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        #map { height: 400px; width: 100%; border-radius: 1rem; }
    </style>
</head>
<body class="bg-brandDark text-white min-h-screen flex flex-col justify-between">

    <!-- الهيدر -->
    <header class="p-4 md:p-6 flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="bg-brandYellow text-brandDark font-black text-xl px-3 py-1 rounded-xl">4U</div>
            <h1 class="text-lg font-bold">بوابة طلبات التوصيل للعملاء</h1>
        </div>
        <a href="index.html" class="text-gray-400 hover:text-white text-sm">
            <i class="fa-solid fa-house ml-1"></i> الرئيسية
        </a>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        <div class="flex flex-col gap-8">
            
            <!-- 1. الخريطة في الأعلى مع زر تحديد الموقع الحالي -->
            <div class="bg-brandCard border border-gray-800 p-6 rounded-3xl shadow-xl flex flex-col space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 class="text-xl font-bold mb-1 flex items-center">
                            <i class="fa-solid fa-map-location-dot text-brandYellow ml-2"></i> تحديد موقع الاستلام والوصول
                        </h2>
                        <p class="text-xs text-gray-400">انقر على الخريطة لتحديد نقطة التسليم، أو اضغط على زر تحديد موقعك الحالي.</p>
                    </div>
                    <button type="button" onclick="locateUser()" class="bg-brandDark border border-brandYellow text-brandYellow text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-brandYellow hover:text-brandDark transition flex items-center gap-2 shadow-md">
                        <i class="fa-solid fa-location-crosshairs"></i> تحديد موقعي الحالي
                    </button>
                </div>
                <div id="map"></div>
            </div>

            <!-- 2. نموذج إدخال بيانات الطلب في الأسفل -->
            <div class="bg-brandCard border border-gray-800 p-6 rounded-3xl shadow-xl space-y-4">
                <h2 class="text-xl font-bold border-b border-gray-700 pb-3 flex items-center">
                    <i class="fa-solid fa-box-open text-brandYellow ml-2"></i> تفاصيل الطلب والمتجر
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">اسم العميل</label>
                        <input type="text" id="clientName" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:border-brandYellow outline-none" placeholder="الاسم الكامل">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">رقم هاتف العميل</label>
                        <input type="tel" id="clientPhone" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:border-brandYellow outline-none" placeholder="09xxxxxxxx">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">اسم المتجر (المرسل)</label>
                        <input type="text" id="storeName" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:border-brandYellow outline-none" placeholder="مثال: متجر شاهين الإلكتروني">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">رقم هاتف المتجر</label>
                        <input type="tel" id="storePhone" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:border-brandYellow outline-none" placeholder="09xxxxxxxx">
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-gray-300 mb-1">نوع البضاعة / الوصف</label>
                    <textarea id="orderDesc" rows="2" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:border-brandYellow outline-none" placeholder="مثال: طرد ملابس، أوراق مهمة..."></textarea>
                </div>

                <div class="bg-brandDark p-4 rounded-2xl border border-gray-800 space-y-2">
                    <div class="flex justify-between text-sm text-gray-400">
                        <span>المسافة المقدرة:</span>
                        <span id="distanceText" class="font-bold text-white">0 كم</span>
                    </div>
                    <div class="flex justify-between text-base font-bold text-brandYellow">
                        <span>التكلفة الإجمالية:</span>
                        <span id="costText">0 جنيه</span>
                    </div>
                </div>

                <button onclick="submitOrder()" id="submitBtn" class="w-full bg-brandYellow text-brandDark font-bold py-3.5 rounded-xl hover:bg-yellow-400 transition shadow-lg">
                    تأكيد وإرسال الطلب إلى مشرف التسويق
                </button>
            </div>

        </div>
    </main>

    <!-- الفوتر -->
    <footer class="p-4 text-center border-t border-gray-800 text-gray-500 text-sm">
        جميع الحقوق محفوظة &copy; 2026 For-U Ecosystem
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-5YFGfzldH3OyWOH7z96vCbUd0isw6aM",
            authDomain: "for-u-56f3f.firebaseapp.com",
            projectId: "for-u-56f3f",
            storageBucket: "for-u-56f3f.firebasestorage.app",
            messagingSenderId: "519930793199",
            appId: "1:519930793199:web:0c876d149832cd0a8d5f1a",
            measurementId: "G-2ZV3NGRYZG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map').setView([15.5007, 32.5599], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let marker = null;
        let selectedLat = null;
        let selectedLng = null;
        const basePricePerKm = 500; 
        let calculatedDistance = 0;

        const companyLat = 15.5007;
        const companyLng = 32.5599;

        function updateLocationData(lat, lng) {
            selectedLat = lat;
            selectedLng = lng;

            if (marker) {
                marker.setLatLng([selectedLat, selectedLng]);
            } else {
                marker = L.marker([selectedLat, selectedLng]).addTo(map);
            }
            map.setView([selectedLat, selectedLng], 15);

            calculatedDistance = calculateDistance(companyLat, companyLng, selectedLat, selectedLng);
            const totalCost = Math.round(calculatedDistance * basePricePerKm);

            document.getElementById('distanceText').innerText = calculatedDistance.toFixed(2) + ' كم';
            document.getElementById('costText').innerText = totalCost.toLocaleString() + ' جنيه';
        }

        map.on('click', function(e) {
            updateLocationData(e.latlng.lat, e.latlng.lng);
        });

        window.locateUser = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        updateLocationData(position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        alert('تعسّر تحديد موقعك تلقائياً. تأكد من تفعيل خدمة الموقع (GPS) في متصفحك.');
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert('متصفحك لا يدعم خاصية تحديد الموقع الجغرافي.');
            }
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI/180);
            const dLon = (lon2 - lon1) * (Math.PI/180);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        window.submitOrder = function() {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const sName = document.getElementById('storeName').value.trim();
            const sPhone = document.getElementById('storePhone').value.trim();
            const desc = document.getElementById('orderDesc').value.trim();

            if(!name || !phone || !sName || !sPhone || !marker) {
                alert('الرجاء إكمال كافة حقول العميل والمتجر، وتحديد الموقع على الخريطة.');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري إرسال الطلب إلى مشرف التسويق...";
            btn.disabled = true;

            const generatedOrderId = 'FOR-' + Math.floor(1000 + Math.random() * 9000);

            const orderData = {
                orderId: generatedOrderId,
                clientName: name,
                clientPhone: phone,
                storeName: sName,
                storePhone: sPhone,
                description: desc,
                lat: selectedLat,
                lng: selectedLng,
                distance: calculatedDistance.toFixed(2),
                cost: Math.round(calculatedDistance * basePricePerKm),
                status: 'pending_supervisor', // موجه لمشرف التسويق مباشرة
                assignedDriver: '',
                createdAt: new Date().toISOString()
            };

            // 1. الحفظ الفوري والآمن في الـ LocalStorage ليظهر فوراً عند مشرف التسويق
            let localPending = JSON.parse(localStorage.getItem('foru_pending_supervisor_orders') || '[]');
            localPending.push(orderData);
            localStorage.setItem('foru_pending_supervisor_orders', JSON.stringify(localPending));

            // 2. محاولة الحفظ في السحابة في الخلفية بدون توقيف واجهة المستخدم
            try {
                addDoc(collection(db, "orders"), orderData).catch(err => {
                    console.log("تم الحفظ محلياً لتجاوز خطأ الاتصال:", err);
                });
            } catch (e) {
                console.log("تجاوز الخطأ السحابي");
            }

            // 3. الانتقال السلس والفوري لصفحة التتبع بدون أي مشاكل أو أخطاء
            window.location.href = `track.html?order=${generatedOrderId}`;
        }
    </script>
</body>
</html>
