<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب توصيل جديد | For-U</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FFB800',
                        brandDark: '#121212',
                        brandCard: '#1E1E1E'
                    }
                }
            }
        }
    </script>
    <!-- Leaflet CSS للخرائط المجانية -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        #map { height: 400px; width: 100%; border-radius: 1rem; }
    </style>
</head>
<body class="bg-brandDark text-white min-h-screen flex flex-col justify-between">

    <!-- الهيدر -->
    <header class="p-4 md:p-6 flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="bg-brandYellow text-brandDark font-black text-xl px-3 py-1 rounded-xl">4U</div>
            <h1 class="text-lg font-bold">بوابة طلبات التوصيل للعملاء</h1>
        </div>
        <a href="index.html" class="text-gray-400 hover:text-white text-sm">
            <i class="fa-solid fa-house ml-1"></i> الرئيسية
        </a>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- نموذج إدخال بيانات الطلب -->
            <div class="bg-brandCard border border-gray-800 p-6 rounded-3xl shadow-xl space-y-4">
                <h2 class="text-xl font-bold border-b border-gray-700 pb-3 flex items-center">
                    <i class="fa-solid fa-box-open text-brandYellow ml-2"></i> تفاصيل الطلب
                </h2>
                
                <div>
                    <label class="block text-sm text-gray-300 mb-1">اسم العميل</label>
                    <input type="text" id="clientName" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:border-brandYellow outline-none" placeholder="الاسم الكامل">
                </div>

                <div>
                    <label class="block text-sm text-gray-300 mb-1">رقم الهاتف</label>
                    <input type="tel" id="clientPhone" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:border-brandYellow outline-none" placeholder="09xxxxxxxx">
                </div>

                <div>
                    <label class="block text-sm text-gray-300 mb-1">نوع البضاعة / الوصف</label>
                    <textarea id="orderDesc" rows="2" class="w-full bg-brandDark border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:border-brandYellow outline-none" placeholder="مثال: طرد ملابس، أوراق مهمة..."></textarea>
                </div>

                <div class="bg-brandDark p-4 rounded-2xl border border-gray-800 space-y-2">
                    <div class="flex justify-between text-sm text-gray-400">
                        <span>المسافة المقدرة:</span>
                        <span id="distanceText" class="font-bold text-white">0 كم</span>
                    </div>
                    <div class="flex justify-between text-base font-bold text-brandYellow">
                        <span>التكلفة الإجمالية:</span>
                        <span id="costText">0 جنيه</span>
                    </div>
                </div>

                <button onclick="submitOrder()" class="w-full bg-brandYellow text-brandDark font-bold py-3.5 rounded-xl hover:bg-yellow-400 transition shadow-lg">
                    تأكيد وإرسال الطلب
                </button>
            </div>

            <!-- الخريطة المجانية (OpenStreetMap) -->
            <div class="bg-brandCard border border-gray-800 p-6 rounded-3xl shadow-xl flex flex-col justify-between space-y-4">
                <div>
                    <h2 class="text-xl font-bold mb-2 flex items-center">
                        <i class="fa-solid fa-map-location-dot text-brandYellow ml-2"></i> تحديد موقع الاستلام والوصول
                    </h2>
                    <p class="text-xs text-gray-400 mb-4">انقر على الخريطة لتحديد نقطة التسليم (سيتم حساب المسافة والسعر تلقائياً).</p>
                </div>
                
                <!-- عنصر الخريطة -->
                <div id="map"></div>
            </div>

        </div>
    </main>

    <!-- نافذة التنبيه المخصصة -->
    <div id="customAlertModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-[#1E1E1E] border border-gray-800 rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl">
            <div id="alertIconContainer" class="w-16 h-16 bg-[#FFB800]/10 border border-[#FFB800]/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-[#FFB800] text-2xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h4 id="alertTitle" class="text-xl font-bold mb-2">تنبيه النظام</h4>
            <p id="alertMessage" class="text-gray-300 text-sm mb-6 leading-relaxed">رسالة...</p>
            <button id="alertActionBtn" onclick="closeCustomAlert()" class="w-full bg-[#FFB800] text-[#121212] font-bold py-3 rounded-xl hover:bg-yellow-400 transition shadow-lg">
                حسنًا
            </button>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="p-4 text-center border-t border-gray-800 text-gray-500 text-sm">
        جميع الحقوق محفوظة &copy; 2026 For-U Ecosystem
    </footer>

    <!-- Leaflet JS للخرائط -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- السكريبت الخاص بالخريطة والمنطق -->
    <script>
        const map = L.map('map').setView([15.5007, 32.5599], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker = null;
        let selectedLat = null;
        let selectedLng = null;
        const basePricePerKm = 500; 
        let calculatedDistance = 0;
        let generatedOrderId = '';

        map.on('click', function(e) {
            selectedLat = e.latlng.lat;
            selectedLng = e.latlng.lng;

            if (marker) {
                marker.setLatLng([selectedLat, selectedLng]);
            } else {
                marker = L.marker([selectedLat, selectedLng]).addTo(map);
            }

            const companyLat = 15.5007;
            const companyLng = 32.5599;
            
            calculatedDistance = calculateDistance(companyLat, companyLng, selectedLat, selectedLng);
            const totalCost = Math.round(calculatedDistance * basePricePerKm);

            document.getElementById('distanceText').innerText = calculatedDistance.toFixed(2) + ' كم';
            document.getElementById('costText').innerText = totalCost.toLocaleString() + ' جنيه';
        });

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        function showCustomAlert(title, message, isError = false, actionCallback = null) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const iconContainer = document.getElementById('alertIconContainer');
            const btn = document.getElementById('alertActionBtn');
            
            if (isError) {
                iconContainer.className = "w-16 h-16 bg-red-500/10 border border-red-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-red-400 text-2xl";
                iconContainer.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                iconContainer.className = "w-16 h-16 bg-[#FFB800]/10 border border-[#FFB800]/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-[#FFB800] text-2xl";
                iconContainer.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }

            if(actionCallback) {
                btn.onclick = actionCallback;
                btn.innerText = "الانتقال إلى تتبع الطلب الآن 🛵";
            } else {
                btn.onclick = closeCustomAlert;
                btn.innerText = "حسنًا";
            }

            const alertModal = document.getElementById('customAlertModal');
            alertModal.classList.remove('hidden');
            alertModal.classList.add('flex');
        }

        function closeCustomAlert() {
            const alertModal = document.getElementById('customAlertModal');
            alertModal.classList.remove('flex');
            alertModal.classList.add('hidden');
        }

        function submitOrder() {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const desc = document.getElementById('orderDesc').value.trim();

            if(!name || !phone || !marker) {
                showCustomAlert('تنبيه ناقص', 'الرجاء إدخال اسم العميل، رقم الهاتف، وتحديد الموقع على الخريطة.', true);
                return;
            }

            // توليد رقم طلب فريد
            generatedOrderId = 'FOR-' + Math.floor(1000 + Math.random() * 9000);

            // حفظ بيانات الطلب في localStorage (أو ربطه بقاعدة البيانات لاحقاً)
            const orderData = {
                orderId: generatedOrderId,
                clientName: name,
                clientPhone: phone,
                description: desc,
                lat: selectedLat,
                lng: selectedLng,
                distance: calculatedDistance.toFixed(2),
                cost: Math.round(calculatedDistance * basePricePerKm),
                status: 'قيد المعالجة'
            };
            localStorage.setItem('latest_order', JSON.stringify(orderData));

            // إظهار رسالة النجاح مع زر الانتقال المباشر لصفحة التتبع والخريطة
            showCustomAlert(
                'تم إرسال الطلب بنجاح!', 
                `رقم طلبك هو (${generatedOrderId}). تم حفظ موقعك بنجاح وجاري تجهيز المندوب.`, 
                false, 
                () => {
                    window.location.href = `track.html?order=${generatedOrderId}`;
                }
            );
        }
    </script>
</body>
</html>
